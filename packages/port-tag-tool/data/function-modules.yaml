# function-modules.yaml — 基于 hermes-agent 实际技术模块名

modules:
  调度中心:
    description: 任务调度、消息路由、事件处理
    technical_modules:
      - gateway
      - cron
      - hermes_cli
      - tui_gateway

  智能体核心:
    description: 智能推理、会话管理、意图识别
    technical_modules:
      - agent
      - acp_adapter

  用户界面:
    description: Web 界面、TUI 终端、桌面应用
    technical_modules:
      - web
      - ui
      - apps
      - website

  插件系统:
    description: 第三方集成、模型提供商、浏览器、存储、技能
    technical_modules:
      - plugins
      - skills
      - optional

  测试:
    description: 测试套件
    technical_modules:
      - tests

  工具:
    description: 开发工具、环境管理
    technical_modules:
      - tools
      - scripts
      - providers
      - packaging
      - project-root
