<script>
// ═══════════════════════════════════════════════════════════════════
console.log("[3d-monitor] Debug mode enabled");
//  3D Topology Viewer v2 — Chip-style nodes, circuit board feel
// ═══════════════════════════════════════════════════════════════════

(function() {
'use strict';

var scene, camera, renderer, labelRenderer, controls;
var nodeGroup, edgeGroup, portGroup;
var flowDots = [];        // { mesh, edgeInfo, progress, speed }
var flowDotsGroup;
var nodeMeshes = {};      // nodeId -> { mesh, data, ports: [], edges: [] }
var edgeLines = [];       // { line, glowLine, conn, fromId, toId }
var portMeshes = {};      // portId -> mesh
var raycaster, mouse, tooltipEl;
var selectedNodeId = null;
var clock = new THREE.Clock();
var _orbitEnabled = false;
var _orbitSpeed = 0.002;
var _orbitAngle = 0;
// --- Idle reset + orbit (v0.1.22) ---
var _idleTimer = null;
var _idleDelay = 0;
var _resetSpeed = 0;
var _resetTargetCamPos = null;
var _resetTargetLookAt = null;
var _orbitResumeTimer = null;
var _levelLabel = null;
var _levelDistance = 0;
var _levelOrbitSpeed = 0;
var _isDragging = false;
var _mouseDownPos = {x: 0, y: 0};
var _dragThreshold = 5;

// ─── Layer config (v0.1.10 — 5-layer adaptive + aggregation) ──────────────────
var LAYER_CONFIG = {
  infrastructure: { y: 0, color: 0x4A90D9, label: '基础设施层' },
  data:           { y: 1, color: 0x00BCD4, label: '数据层' },
  business:       { y: 2, color: 0x66BB6A, label: '业务逻辑层' },
  presentation:   { y: 3, color: 0xFFB74D, label: '展示层' },
  external:       { y: 4, color: 0xFF7043, label: '外部依赖层' },
};

// Alias map: old layer names -> new 5-layer keys (backward compat)
var LAYER_ALIAS = {
  agent:     'business',
  command:   'infrastructure',
  control:  'infrastructure',
  frontend: 'presentation',
  backend:  'business',
  analysis: 'data',
  build:    'infrastructure',
  config:   'infrastructure',
  feature:  'business',
  risk:     'data',
  decision: 'business',
  management: 'presentation',
};

// ─── Infer layer from node identity (v0.1.10) ─────────────────────
function inferLayer(node) {
  var id = (node.id || '').toLowerCase();
  var tags = (node.tags || []).map(function(t) { return t.toLowerCase(); });
  var allText = id + ' ' + tags.join(' ');

  // Check from highest (external) to lowest (infrastructure) priority
  if (/dep-|^external|third.?party|vendor|react|axios|lodash|three/.test(allText)) {
    return 'external';
  }
  if (/component|view|ui|widget|screen|layout|icon|style|css/.test(allText)) {
    return 'presentation';
  }
  if (/page|route|service|controller|logic|middleware|handler|provider/.test(allText)) {
    return 'business';
  }
  if (/api|client|store|data|hook|database|db|model|schema/.test(allText)) {
    return 'data';
  }
  // Default: infrastructure
  return 'infrastructure';
}

/**
 * Resolve the effective layer key for a node.
 * 1) If n.layer exists, try LAYER_ALIAS mapping.
 * 2) Otherwise fall back to inferLayer().
 */
function resolveLayer(n) {
  if (n.layer && LAYER_ALIAS[n.layer]) return LAYER_ALIAS[n.layer];
  if (n.layer && LAYER_CONFIG[n.layer]) return n.layer;
  return inferLayer(n);
}

/**
 * Resolve the effective color for a node.
 */
function resolveLayerColor(n) {
  var lk = resolveLayer(n);
  var cfg = LAYER_CONFIG[lk];
  return cfg ? cfg.color : (n.color ? new THREE.Color(n.color).getHex() : 0x888888);
}

var FLOW_COLORS = {
  control:  0x4FC3F7,
  data:     0x00BCD4,
  event:    0xE040FB,
  knowledge: 0x7B1FA2,
};
// ═══════════════════════════════════════════════════════════════════
//  Aggregation / Folding State (v0.1.10)
// ═══════════════════════════════════════════════════════════════════

var AGGREGATION = {
  // Mode: 'none' | 'flat' | 'grouped' | 'multi'
  mode: 'none',
  // Module group definitions: { groupId, label, childIds[], layer, position, expanded }
  groups: [],
  groupMap: {},   // groupId -> group
  childGroupMap: {}, // nodeId -> parent groupId
  // Edge bundles: { bundleId, fromGroup, toGroup, childEdges[] }
  bundles: [],
};

// ─── Aggregation logic — directory-based module grouping ─────────
function buildAggregation(nodes, conns) {
  var count = nodes.length;

  // Determine mode
  if (count < 20) {
    AGGREGATION.mode = 'none';
    return { nodes: nodes, conns: conns || [] };
  }

  var mode = (count >= 100) ? 'multi' : 'grouped';
  AGGREGATION.mode = mode;
  AGGREGATION.groups = [];
  AGGREGATION.groupMap = {};
  AGGREGATION.childGroupMap = {};
  AGGREGATION.bundles = [];

  // Group nodes by directory prefix (first path segment)
  var dirBuckets = {};
  var ungrouped = [];

  nodes.forEach(function(n) {
    var id = n.id || '';
    // Extract directory prefix from node id
    var dir = extractDirPrefix(id);
    if (dir && dir !== id) {
      if (!dirBuckets[dir]) dirBuckets[dir] = [];
      dirBuckets[dir].push(n);
    } else {
      ungrouped.push(n);
    }
  });

  // Create group nodes for buckets with >= 2 children
  var groupNodes = [];
  var flatNodes = [];
  var groupIdCounter = 0;

  Object.keys(dirBuckets).forEach(function(dir) {
    var children = dirBuckets[dir];
    if (children.length < 2) {
      children.forEach(function(c) { flatNodes.push(c); });
      return;
    }
    var groupId = '__group_' + (groupIdCounter++);

    // Find parent node or create synthetic one
    var existingParent = null;
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].id === dir) { existingParent = nodes[i]; break; }
    }

    // Collect child IDs and aggregate properties
    var childIds = children.map(function(c) { return c.id; });
    var childLayers = {};
    children.forEach(function(c) {
      var lk = resolveLayer(c);
      if (!childLayers[lk]) childLayers[lk] = 0;
      childLayers[lk]++;
    });
    var dominantLayer = 'infrastructure';
    var maxCount = 0;
    Object.keys(childLayers).forEach(function(lk) {
      if (childLayers[lk] > maxCount) { maxCount = childLayers[lk]; dominantLayer = lk; }
    });

    var groupNode = {
      id: groupId,
      label: dir + ' (' + children.length + ')',
      chineseName: dir + ' (' + children.length + ')',
      description: children.length + ' sub-nodes in ' + dir + '/',
      layer: dominantLayer,
      _isGroupNode: true,
      _childIds: childIds,
      _expanded: false,
      _childNodes: children,
      color: resolveLayerColor({ layer: dominantLayer }),
    };

    AGGREGATION.groups.push({
      groupId: groupId,
      label: dir,
      childIds: childIds,
      layer: dominantLayer,
      expanded: false,
    });
    AGGREGATION.groupMap[groupId] = AGGREGATION.groups[AGGREGATION.groups.length - 1];
    childIds.forEach(function(cid) {
      AGGREGATION.childGroupMap[cid] = groupId;
    });

    groupNodes.push(groupNode);
  });

  // Ungrouped nodes go flat
  ungrouped.forEach(function(n) { flatNodes.push(n); });

  // Build edge bundles
  var connList = conns || [];
  var bundleMap = {};

  AGGREGATION.groups.forEach(function(grp) {
    grp.childIds.forEach(function(cid) {
      connList.forEach(function(c) {
        if (c.from === cid || c.to === cid) {
          var otherId = (c.from === cid) ? c.to : c.from;
          var otherGroupId = AGGREGATION.childGroupMap[otherId];
          // Bundle key: groupId -> otherGroupId
          var key;
          if (otherGroupId) {
            key = grp.groupId + '->' + otherGroupId;
          } else {
            key = grp.groupId + '->' + otherId;
          }
          if (!bundleMap[key]) bundleMap[key] = [];
          bundleMap[key].push(c);
        }
      });
    });
  });

  Object.keys(bundleMap).forEach(function(key) {
    AGGREGATION.bundles.push({
      bundleId: key,
      edges: bundleMap[key],
      count: bundleMap[key].length,
    });
  });

  // Final node list: group nodes + flat nodes
  // Include ALL children as well (set invisible initially) for fast expand
  var allFlatNodes = [];
  AGGREGATION.groups.forEach(function(grp) {
    grp.childIds.forEach(function(cid) {
      allFlatNodes.push(cid);
    });
  });
  // Add invisible markers for child nodes
  // Children are included in result but marked invisible
  var resultNodes = groupNodes.concat(flatNodes);
  // Store ALL original nodes (including children) for expand
  AGGREGATION._allOriginalNodes = nodes;
  AGGREGATION._allOriginalConns = conns;

  // Build filtered connections (only group-level + non-grouped)
  var resultConns = [];
  connList.forEach(function(c) {
    var fromGroup = AGGREGATION.childGroupMap[c.from];
    var toGroup = AGGREGATION.childGroupMap[c.to];
    if (fromGroup && toGroup) {
      // Both are in groups — add a single bus connection between groups if not already added
      var busKey = fromGroup + '->' + toGroup;
      var already = false;
      for (var bi = 0; bi < resultConns.length; bi++) {
        if (resultConns[bi].from === fromGroup && resultConns[bi].to === toGroup) {
          already = true;
          // Accumulate labels
          var existing = resultConns[bi];
          if (c.label && existing.label.indexOf(c.label) === -1) {
            existing.label += ', ' + c.label;
          }
          break;
        }
      }
      if (!already) {
        resultConns.push({
          from: fromGroup,
          to: toGroup,
          label: c.label || '',
          flowType: c.flowType || 'data',
          _bundleCount: bundleMap[fromGroup + '->' + toGroup]
            ? bundleMap[fromGroup + '->' + toGroup].length : 1,
        });
      }
    } else if (fromGroup) {
      // From grouped, to flat
      resultConns.push({
        from: fromGroup,
        to: c.to,
        label: c.label || '',
        flowType: c.flowType || 'data',
      });
    } else if (toGroup) {
      // From flat, to grouped
      resultConns.push({
        from: c.from,
        to: toGroup,
        label: c.label || '',
        flowType: c.flowType || 'data',
      });
    } else {
      resultConns.push(c);
    }
  });

  return { nodes: resultNodes, conns: resultConns };
}

// Extract first directory segment from an ID like "components/Button" -> "components"
function extractDirPrefix(id) {
  if (!id) return null;
  // Match first path segment: "components/Button/index.js" -> "components"
  var m = id.match(/^([a-zA-Z0-9_-]+)[/\\]/);
  if (m) return m[1];
  // Also try packages/xxx patterns
  var m2 = id.match(/^packages[/\\]([a-zA-Z0-9_-]+)/);
  if (m2) return m2[1];
  // v0.1.13: Match numeric-suffixed IDs like "node-1", "service_2" -> "node", "service"
  var m3 = id.match(/^([a-zA-Z_]+)[-_][0-9]+$/);
  if (m3) return m3[1];
  // Match namespace-prefixed IDs: "auth.login", "core.renderer" -> "auth", "core"
  var m4 = id.match(/^([a-zA-Z0-9_-]+)[.]/);
  if (m4) return m4[1];
  return null;
}

// ─── Expand/collapse a group node ──────────────────────────────
function toggleGroup(groupId, nodes, conns, positions) {
  var grp = AGGREGATION.groupMap[groupId];
  if (!grp) return;

  grp.expanded = !grp.expanded;

  if (grp.expanded) {
    // Expand: show children, hide group node, show internal edges
    showGroupChildren(grp);
    hideGroupNode(grp);
  } else {
    // Collapse: hide children, show group node, hide internal edges
    hideGroupChildren(grp);
    showGroupNode(grp);
  }
}

function showGroupChildren(grp) {
  grp.childIds.forEach(function(cid) {
    var nm = nodeMeshes[cid];
    if (nm) {
      nm.mesh.visible = true;
      // Also show the label
      nm.mesh.parent.children.forEach(function(child) {
        if (child.isCSS2DObject && child.userData && child.userData.nodeId === cid) {
          child.visible = true;
        }
      });
    }
  });
  // Show internal edges
  edgeLines.forEach(function(ei) {
    var inGroup = grp.childIds.indexOf(ei.fromId) >= 0 && grp.childIds.indexOf(ei.toId) >= 0;
    if (inGroup) {
      if (ei.coreTube) ei.coreTube.visible = true;
      if (ei.glowTube) ei.glowTube.visible = true;
      // CSS2D labels
      if (ei._labelObj) ei._labelObj.visible = true;
    }
  });
}

function hideGroupChildren(grp) {
  grp.childIds.forEach(function(cid) {
    var nm = nodeMeshes[cid];
    if (nm) {
      nm.mesh.visible = false;
      nm.mesh.parent.children.forEach(function(child) {
        if (child.isCSS2DObject && child.userData && child.userData.nodeId === cid) {
          child.visible = false;
        }
      });
    }
  });
  // Hide internal edges
  edgeLines.forEach(function(ei) {
    var inGroup = grp.childIds.indexOf(ei.fromId) >= 0 && grp.childIds.indexOf(ei.toId) >= 0;
    if (inGroup) {
      if (ei.coreTube) ei.coreTube.visible = false;
      if (ei.glowTube) ei.glowTube.visible = false;
      if (ei._labelObj) ei._labelObj.visible = false;
    }
  });
}

function hideGroupNode(grp) {
  var nm = nodeMeshes[grp.groupId];
  if (nm) {
    nm.mesh.visible = false;
    nm.mesh.parent.children.forEach(function(child) {
      if (child.isCSS2DObject && child.userData && child.userData.nodeId === grp.groupId) {
        child.visible = false;
      }
    });
  }
  // Hide group-level bus edges that go to/from this group
  edgeLines.forEach(function(ei) {
    if (ei.fromId === grp.groupId || ei.toId === grp.groupId) {
      if (ei.coreTube) ei.coreTube.visible = false;
      if (ei.glowTube) ei.glowTube.visible = false;
      if (ei._labelObj) ei._labelObj.visible = false;
    }
  });
}

function showGroupNode(grp) {
  var nm = nodeMeshes[grp.groupId];
  if (nm) {
    nm.mesh.visible = true;
    nm.mesh.parent.children.forEach(function(child) {
      if (child.isCSS2DObject && child.userData && child.userData.nodeId === grp.groupId) {

  edgeLines.forEach(function(ei) {
    if (ei.fromId === grp.groupId || ei.toId === grp.groupId) {
      if (ei.coreTube) ei.coreTube.visible = true;
      if (ei.glowTube) ei.glowTube.visible = true;
      if (ei._labelObj) ei._labelObj.visible = true;
    }
  });
}

// --- Idle reset + orbit helpers (v0.1.22 --- 完全重写) ---

function computeLevelDistance(level) {
  var bbox = computeSceneBoundingBox();
  var diag = (bbox && bbox.diagonal > 0.1) ? bbox.diagonal : 12;
  var fullDist = diag * 0.9;
  if (level === "full")   return { distance: fullDist,       orbitSpeed: 0.02  };
  if (level === "medium") return { distance: fullDist * 1.3,  orbitSpeed: 0.005 };
  if (level === "slow")   return { distance: fullDist * 1.5,  orbitSpeed: 0.002 };
  return { distance: fullDist, orbitSpeed: 0.02 };
}

function computeSceneBoundingBox() {
  var bbox = { min: { x: Infinity, y: Infinity, z: Infinity }, max: { x: -Infinity, y: -Infinity, z: -Infinity } };
  var hasNodes = false;
  Object.keys(nodeMeshes).forEach(function(id) {
    var pos = nodeMeshes[id].mesh.position;
    if (pos.x < bbox.min.x) bbox.min.x = pos.x;
    if (pos.y < bbox.min.y) bbox.min.y = pos.y;
    if (pos.z < bbox.min.z) bbox.min.z = pos.z;
    if (pos.x > bbox.max.x) bbox.max.x = pos.x;
    if (pos.y > bbox.max.y) bbox.max.y = pos.y;
    if (pos.z > bbox.max.z) bbox.max.z = pos.z;
    hasNodes = true;
  });
  if (!hasNodes) return null;
  var dx = bbox.max.x - bbox.min.x;
  var dy = bbox.max.y - bbox.min.y;
  var dz = bbox.max.z - bbox.min.z;
  var diagonal = Math.sqrt(dx*dx + dy*dy + dz*dz);
  return {
    min: bbox.min,
    max: bbox.max,
    center: { x: (bbox.min.x + bbox.max.x) / 2, y: (bbox.min.y + bbox.max.y) / 2, z: (bbox.min.z + bbox.max.z) / 2 },
    diagonal: diagonal
  };
}

function startIdleTimer() {
  if (_idleTimer) return;
  _idleTimer = setInterval(function() {
    if (_userInteracting || _resetTargetCamPos) {
      if (_userInteracting) { _idleDelay = 0; _levelLabel = null; }
      return;
    }
    if (_orbitEnabled) {
      console.log("[timer] orbit running, skip reset");
      return;
    }
    _idleDelay += 100;
    if (_idleDelay < 15000) return;
    var level;
    if (_idleDelay >= 60000)      level = "full";
    else if (_idleDelay >= 30000) level = "medium";
    else if (_idleDelay >= 15000) level = "slow";
    else return;
    if (_levelLabel === level) return;
    console.log("[timer] tick", _idleDelay, _orbitEnabled, _userInteracting, _resetTargetCamPos ? "resetting" : "idle");
    var cfg = computeLevelDistance(level);
    var center = new THREE.Vector3(0, 0, 0);
    if (selectedNodeId && nodeMeshes[selectedNodeId]) center.copy(nodeMeshes[selectedNodeId].mesh.position);
    var curPos = camera.position.clone();
    var theta = Math.atan2(curPos.x - center.x, curPos.z - center.z);
    _orbitAngle = theta;
    var targetPos = new THREE.Vector3(
      center.x + cfg.distance * Math.sin(theta),
      center.y + cfg.distance * 0.35,
      center.z + cfg.distance * Math.cos(theta)
    );
    _resetTargetCamPos = targetPos;
    _resetTargetLookAt = center.clone();
    _levelDistance = cfg.distance;
    console.log("[timer] TRIGGER RESET", level, _levelLabel);
    _levelOrbitSpeed = cfg.orbitSpeed;
    _levelLabel = level;
    _orbitEnabled = false;
    var travelDist = camera.position.distanceTo(targetPos);
    _resetSpeed = travelDist / 4.0;
  }, 100);
}

function onUserInteraction() {
  _idleDelay = 0;
  _levelLabel = null;
  _resetTargetCamPos = null;
  _resetTargetLookAt = null;
  _orbitEnabled = false;
  if (_orbitResumeTimer) { clearTimeout(_orbitResumeTimer); _orbitResumeTimer = null; }
  if (_idleTimer) { clearInterval(_idleTimer); _idleTimer = null; }
  startIdleTimer();
}
// ═══════════════════════════════════════════════════════════════════
//  Layout — Layer-based stacking with horizontal grid
// ═══════════════════════════════════════════════════════════════════

function computeLayout(nodes) {
  var LAYERS = {
    infrastructure: { y: 0, color: 0x4A90D9, label: '基础设施层' },
    data:           { y: 1, color: 0x00BCD4, label: '数据层' },
    business:       { y: 2, color: 0x66BB6A, label: '业务逻辑层' },
    presentation:   { y: 3, color: 0xFFB74D, label: '展示层' },
    external:       { y: 4, color: 0xFF7043, label: '外部依赖层' },
  };

  // 1. Infer layer for each node
  var layerBuckets = {};
  var layerKeys = ['infrastructure', 'data', 'business', 'presentation', 'external'];
  layerKeys.forEach(function(k) { layerBuckets[k] = []; });

  nodes.forEach(function(n) {
    var lk = resolveLayer(n);
    if (!layerBuckets[lk]) layerBuckets[lk] = [];
    layerBuckets[lk].push(n);
  });

  // v0.1.17: Infer domain group from node identity
  function inferGroup(n) {
    var id = (n.id || n.name || '').toLowerCase();
    if (id.includes('node_module') || id.includes('dep-')) return 'external';
    if (id.includes('src') || id.includes('public')) return 'frontend';
    if (id.includes('.hermes') || id.includes('tool') || id.includes('script') || id.includes('server')) return 'devtools';
    return 'core'; // port-tag-tool, 3d-monitor, 及其他核心模块
  }

  // v0.1.17: Z offset by domain group (内外边界)
  var GROUP_Z_OFFSETS = {
    external: -6.0,
    devtools: -3.0,
    core:     0,
    frontend: 3.0,
  };

  // v0.1.17: Group ordering along X axis (left to right)
  var GROUP_X_ORDER = ['frontend', 'core', 'devtools', 'external'];

  var positions = {};
  var NODE_SIZE_X = 1.2;
  var NODE_SIZE_Z = 1.2;
  var NODE_SIZE_Y = 0.72;

  // v0.1.13: Track all placed bounding boxes for per-node anti-collision
  var placedBoxes = [];

  layerKeys.forEach(function(lk) {
    var bucket = layerBuckets[lk] || [];
    var count = bucket.length;
    if (count === 0) return;

    var yPos = LAYERS[lk].y;

    // v0.1.13: Base spacing = node size + 1.5x node width safety margin
    var minSpacingX = NODE_SIZE_X * 1.5;
    var minSpacingZ = NODE_SIZE_Z * 1.5;
    var minSpacingY = NODE_SIZE_Y * 2.0;

    // v0.1.17: Group nodes within this layer by domain
    var groupBuckets = {};
    bucket.forEach(function(n) {
      var g = inferGroup(n);
      if (!groupBuckets[g]) groupBuckets[g] = [];
      groupBuckets[g].push(n);
    });

    // v0.1.17: Assign X positions by group ordering
    var groupSpacing = 5.0;     // spacing between groups
    var intraGroupSpacing = 2.2; // spacing within a group
    var groupWidths = {};
    GROUP_X_ORDER.forEach(function(g) {
      var gb = groupBuckets[g] || [];
      if (gb.length === 0) { groupWidths[g] = 0; return; }
      groupWidths[g] = (gb.length - 1) * intraGroupSpacing;
    });

    // Compute total width and center the groups
    var totalWidth = 0;
    var groupStarts = {};
    GROUP_X_ORDER.forEach(function(g) {
      groupStarts[g] = totalWidth;
      if (groupWidths[g] > 0) {
        totalWidth += groupWidths[g] + groupSpacing;
      }
    });
    // Remove trailing groupSpacing
    if (totalWidth > 0) totalWidth -= groupSpacing;

    var offsetX = -totalWidth / 2;

    // Process each group in order
    GROUP_X_ORDER.forEach(function(g) {
      var gb = groupBuckets[g] || [];
      if (gb.length === 0) return;

      // v0.1.17: Z base from group semantic
      var groupZBase = GROUP_Z_OFFSETS[g] || 0;

      // v0.1.18: Multi-row layout — max 6 nodes per row, auto wrap on Z axis
      var MAX_PER_ROW = 6;
      var rowCount = Math.ceil(gb.length / MAX_PER_ROW);
      var totalRows = rowCount;

      gb.forEach(function(n, gi) {
        // Determine row (Z) and column (X) within this group
        var rowIndex = Math.floor(gi / MAX_PER_ROW);
        var colIndex = gi % MAX_PER_ROW;
        var nodesInThisRow = Math.min(MAX_PER_ROW, gb.length - rowIndex * MAX_PER_ROW);

        // X: position within row, centered within the group's X span
        // Use colIndex (0..nodesInThisRow-1) not gi, so each row starts at same X
        var gx = offsetX + groupStarts[g] + colIndex * intraGroupSpacing;

        // Z: row depth offset — each new row shifts along Z axis
        var rowZOffset = rowIndex * (NODE_SIZE_Z * 2.0);
        var gz = groupZBase + rowZOffset + (Math.random() - 0.5) * 0.6;

        var assignedPos = { x: gx, y: yPos, z: gz };
        var pushIter = 0;
        var maxPushIter = 10;
        var pushDistX = 0.4;
        var pushDistZ = 0.3;

        while (pushIter < maxPushIter) {
          var collision = false;
          for (var pi = 0; pi < placedBoxes.length; pi++) {
            var pb = placedBoxes[pi];
            var overlapX = Math.abs(assignedPos.x - pb.x) < (NODE_SIZE_X * 0.5 + minSpacingX * 0.5);
            var overlapY = Math.abs(assignedPos.y - pb.y) < (NODE_SIZE_Y * 0.5 + minSpacingY * 0.5);
            var overlapZ = Math.abs(assignedPos.z - pb.z) < (NODE_SIZE_Z * 0.5 + minSpacingZ * 0.5);
            if (overlapX && overlapY && overlapZ) {
              collision = true;
              break;
            }
          }
          if (!collision) break;

          // Push away: Z first (along depth axis), then X
          assignedPos.z += pushDistZ * (pushIter % 2 === 0 ? 1 : -1);
          if (pushIter >= 3) {
            assignedPos.x += pushDistX * (pushIter % 2 === 0 ? 1 : -1);
          }
          pushDistZ += 0.15;
          pushIter++;
        }

        // Store in placed boxes for subsequent node collision checks
        placedBoxes.push({ x: assignedPos.x, y: assignedPos.y, z: assignedPos.z });

        positions[n.id] = assignedPos;
        n._pos = assignedPos;
      });
    });
  });

  // v0.1.13: Reposition group nodes to center of their children, with Y clearance
  AGGREGATION.groups.forEach(function(grp) {
    if (!positions[grp.groupId]) return;
    var childPositions = [];
    grp.childIds.forEach(function(cid) {
      if (positions[cid]) childPositions.push(positions[cid]);
    });
    if (childPositions.length === 0) return;
    var cx = 0, cy = 0, cz = 0;
    childPositions.forEach(function(p) { cx += p.x; cy += p.y; cz += p.z; });
    cx /= childPositions.length;
    cy /= childPositions.length;
    cz /= childPositions.length;
    // Add Y offset so group node sits clearly above children
    cy += 2.0;

    // Move group node Z slightly forward (negative Z) so it doesn't overlap children in depth
    cz -= 0.8;

    var assignedPos = positions[grp.groupId];
    assignedPos.x = cx;
    assignedPos.y = cy;
    assignedPos.z = cz;
  });

  return positions;
}

// ─── Helpers for pipe obstacle avoidance ──────────────────────────
function getNodeBox(nodeId, positions) {
  var pos = positions[nodeId];
  if (!pos) return null;
  var size = 1.2;
  var margin = 0.08; // small margin for better collision detection
  return {
    minX: pos.x - size * 0.5 - margin,
    maxX: pos.x + size * 0.5 + margin,
    minY: pos.y - size * 0.3 - margin,
    maxY: pos.y + size * 0.3 + margin,
    minZ: pos.z - size * 0.5 - margin,
    maxZ: pos.z + size * 0.5 + margin,
  };
}

function pointInBox(px, py, pz, box) {
  return px >= box.minX && px <= box.maxX &&
         py >= box.minY && py <= box.maxY &&
         pz >= box.minZ && pz <= box.maxZ;
}

function linePenetratesBox(x1, y1, z1, x2, y2, z2, box, steps) {
  steps = steps || 10;
  for (var i = 1; i < steps; i++) {
    var t = i / steps;
    var px = x1 + (x2 - x1) * t;
    var py = y1 + (y2 - y1) * t;
    var pz = z1 + (z2 - z1) * t;
    if (pointInBox(px, py, pz, box)) return true;
  }
  return false;
}

function findObstacles(fromId, toId, nodeIds, positions) {
  var fromPos = positions[fromId];
  var toPos = positions[toId];
  if (!fromPos || !toPos) return [];
  var obstacles = [];
  nodeIds.forEach(function(nid) {
    if (nid === fromId || nid === toId) return;
    var box = getNodeBox(nid, positions);
    if (!box) return;
    if (linePenetratesBox(fromPos.x, fromPos.y, fromPos.z, toPos.x, toPos.y, toPos.z, box, 24)) {
      obstacles.push({ id: nid, box: box, pos: positions[nid] });
    }
  });
  return obstacles;
}

// ═══════════════════════════════════════════════════════════════════
//  Pipe-vs-Pipe Crossing Detection & Elevation
// ═══════════════════════════════════════════════════════════════════
// Detect crossing pipes in XZ plane and assign elevation offsets so
// crossing pipes are vertically separated, mimicking PCB routing.
var pipeElevations = {};  // "fromId->toId" -> { yBump: N, zOff: M } 3D offset (v0.1.12)
var pipeCrossings = [];   // metadata about which pipes cross

function computePipeCrossings(allConns, positions) {
  pipeElevations = {};
  pipeCrossings = [];

  // Build segment list with full 3D info
  var segs = [];
  allConns.forEach(function(conn) {
    var fp = positions[conn.from];
    var tp = positions[conn.to];
    if (!fp || !tp) return;
    var key = conn.from + '->' + conn.to;
    segs.push({
      key: key, from: conn.from, to: conn.to,
      fromPos: fp, toPos: tp,
      dx: tp.x - fp.x, dy: tp.y - fp.y, dz: tp.z - fp.z,
    });
  });

  // v0.1.13: True 3D crossing — check intersection in XY, XZ, and YZ planes
  for (var i = 0; i < segs.length; i++) {
    for (var j = i + 1; j < segs.length; j++) {
      var a = segs[i], b = segs[j];
      // Skip if they share an endpoint
      if (a.from === b.from || a.from === b.to || a.to === b.from || a.to === b.to) continue;

      // Check XY plane intersection
      var xyCross = lineIntersect2D(
        a.fromPos.x, a.fromPos.y, a.toPos.x, a.toPos.y,
        b.fromPos.x, b.fromPos.y, b.toPos.x, b.toPos.y
      );
      // Check XZ plane intersection
      var xzCross = lineIntersect2D(
        a.fromPos.x, a.fromPos.z, a.toPos.x, a.toPos.z,
        b.fromPos.x, b.fromPos.z, b.toPos.x, b.toPos.z
      );
      // Check YZ plane intersection
      var yzCross = lineIntersect2D(
        a.fromPos.y, a.fromPos.z, a.toPos.y, a.toPos.z,
        b.fromPos.y, b.fromPos.z, b.toPos.y, b.toPos.z
      );

      // True 3D crossing: both XY and XZ intersect, OR the pipes pass close enough in 3D
      var close3D = false;
      var samplePtsA = 8;
      var samplePtsB = 8;
      for (var si = 1; si < samplePtsA && !close3D; si++) {
        var ta = si / samplePtsA;
        var pax = a.fromPos.x + (a.toPos.x - a.fromPos.x) * ta;
        var pay = a.fromPos.y + (a.toPos.y - a.fromPos.y) * ta;
        var paz = a.fromPos.z + (a.toPos.z - a.fromPos.z) * ta;
        for (var sj = 1; sj < samplePtsB && !close3D; sj++) {
          var tb = sj / samplePtsB;
          var pbx = b.fromPos.x + (b.toPos.x - b.fromPos.x) * tb;
          var pby = b.fromPos.y + (b.toPos.y - b.fromPos.y) * tb;
          var pbz = b.fromPos.z + (b.toPos.z - b.fromPos.z) * tb;
          var dx3 = pax - pbx, dy3 = pay - pby, dz3 = paz - pbz;
          if (dx3*dx3 + dy3*dy3 + dz3*dz3 < 0.64) { // < 0.8 distance threshold
            close3D = true;
          }
        }
      }

      if (!close3D) continue;

      pipeCrossings.push({
        pipeA: a.key, pipeB: b.key,
        a: a, b: b,
      });
    }
  }

  // v0.1.13: Assign true 3D offsets — Y elevation AND Z lateral shift for each crossing pipe
  var crossingCount = {};
  pipeCrossings.forEach(function(cr) {
    crossingCount[cr.pipeA] = (crossingCount[cr.pipeA] || 0) + 1;
    crossingCount[cr.pipeB] = (crossingCount[cr.pipeB] || 0) + 1;
  });

  allConns.forEach(function(conn) {
    var key = conn.from + '->' + conn.to;
    var cnt = crossingCount[key] || 0;
    // v0.1.13: Randomize initial Z offset so not all pipes share the same plane
    var hash = 0;
    for (var _hi = 0; _hi < key.length; _hi++) hash = ((hash << 5) - hash) + key.charCodeAt(_hi);
    var zRand = ((hash % 17) - 8) / 10; // -0.8 to 0.8
    pipeElevations[key] = { yBump: cnt * 0.25, zOff: zRand };
  });

  // For each crossing pair, assign Z offsets so one pipe goes +Z and the other goes -Z
  pipeCrossings.forEach(function(cr) {
    var elA = pipeElevations[cr.pipeA] || { yBump: 0, zOff: 0 };
    var elB = pipeElevations[cr.pipeB] || { yBump: 0, zOff: 0 };
    var cntA = crossingCount[cr.pipeA] || 0;
    var cntB = crossingCount[cr.pipeB] || 0;

    // Z separation: pipe with more crossings keeps its zOff, the other shifts opposite
    var zSep = 0.8 + cntB * 0.1;
    if (cntA >= cntB) {
      elB.zOff -= zSep;
    } else {
      elA.zOff += zSep;
    }
    // Y separation: ensure minimum 0.5 vertical gap
    if (Math.abs(elA.yBump - elB.yBump) < 0.5) {
      if (cntA > cntB) {
        elA.yBump = Math.max(elA.yBump, elB.yBump) + 0.5;
      } else {
        elB.yBump = Math.max(elA.yBump, elB.yBump) + 0.5;
      }
    }
    pipeElevations[cr.pipeA] = elA;
    pipeElevations[cr.pipeB] = elB;
  });
}

// v0.1.13: 2D line intersection helper
function lineIntersect2D(x1, y1, x2, y2, x3, y3, x4, y4) {
  var denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
  if (Math.abs(denom) < 0.0001) return null;
  var t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;

  var activeLayers = {};
  dataNodes.forEach(function(n) { activeLayers[resolveLayer(n)] = true; });
  document.getElementById('layerCount').textContent = Object.keys(activeLayers).length;

  // v0.1.10: Also add child nodes (initially hidden) for fast expand
  if (AGGREGATION.mode !== 'none' && AGGREGATION._allOriginalNodes) {
    var existingIds = {};
    dataNodes.forEach(function(n) { existingIds[n.id] = true; });

    AGGREGATION._allOriginalNodes.forEach(function(n) {
      if (existingIds[n.id]) return; // already in scene
      if (n._isGroupNode) return;
      var pos = positions[n.id];
      if (!pos) return;
      nodeMap[n.id] = n;
      var layerKey = resolveLayer(n);
      var chipColor = resolveLayerColor(n);
      n.layer = layerKey;

      var size = 0.9; // smaller size for child nodes
      var geo = new THREE.BoxGeometry(size, size * 0.5, size);
      // v0.1.12: Depth visual enhancement for child nodes
      var _depthFactor = THREE.MathUtils.clamp((pos.z + 6) / 12, 0, 1);
      var mat = new THREE.MeshStandardMaterial({
        color: chipColor,
        roughness: 0.4,
        metalness: 0.5,
        emissive: chipColor,
        emissiveIntensity: 0.04 + _depthFactor * 0.08,
        transparent: true,
        opacity: 0.70 + _depthFactor * 0.20,
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.nodeId = n.id;
      mesh.userData.isNode = true;
      mesh.visible = false; // hidden initially
      nodeMeshes[n.id] = { mesh: mesh, data: n, ports: [], edges: [] };
      nodeGroup.add(mesh);

      // Label (CSS2D)
      var labelDiv = document.createElement('div');
      labelDiv.className = 'label-2d';
      labelDiv.style.fontSize = '10px';
      labelDiv.style.opacity = '0.6';
      labelDiv.textContent = n.chineseName || n.label || n.id;
      var label = new THREE.CSS2DObject(labelDiv);
      label.position.set(pos.x, pos.y + size * 0.5 + 0.3, pos.z);
      label.userData.nodeId = n.id;
      label.visible = false;
      mesh.userData.labelObj = label;
      nodeGroup.add(label);
    });

    // Also add internal edges (hidden initially)
    if (AGGREGATION._allOriginalConns) {
      AGGREGATION._allOriginalConns.forEach(function(conn) {
        var fromGroup = AGGREGATION.childGroupMap[conn.from];
        var toGroup = AGGREGATION.childGroupMap[conn.to];
        // Only add edges that are inter-child within a group (internal edges)
        if (!fromGroup || !toGroup || fromGroup !== toGroup) return;
        // This is an internal edge within a group
        var fromPos3d = positions[conn.from];
        var toPos3d = positions[conn.to];
        if (!fromPos3d || !toPos3d) return;
        var fp = new THREE.Vector3(fromPos3d.x, fromPos3d.y, fromPos3d.z);
        var tp = new THREE.Vector3(toPos3d.x, toPos3d.y, toPos3d.z);
        var flowType = conn.flowType || 'data';
        var colorHex = FLOW_COLORS[flowType] || 0x888888;
        var internalCurve = new THREE.CubicBezierCurve3(fp, fp.clone().add(new THREE.Vector3(0, 0.5, 0)), tp.clone().add(new THREE.Vector3(0, 0.5, 0)), tp);
        // Thin line for internal edges
        var tubeGeo = new THREE.TubeGeometry(internalCurve, 12, 0.02, 6, false);
        var tubeMat = new THREE.MeshBasicMaterial({
          color: colorHex,
          transparent: true,
          opacity: 0.4,
        });
        var tube = new THREE.Mesh(tubeGeo, tubeMat);
        tube.visible = false;
        edgeGroup.add(tube);
        var ei = {
          line: tube,
          coreTube: tube,
          glowTube: null,
          conn: conn,
          fromId: conn.from,
          toId: conn.to,
          curve: internalCurve,
          flowType: flowType,
          colorHex: colorHex,
          _isInternalEdge: true,
        };
        edgeLines.push(ei);
        if (nodeMeshes[conn.from]) nodeMeshes[conn.from].edges.push(ei);
        if (nodeMeshes[conn.to]) nodeMeshes[conn.to].edges.push(ei);
      });
    }
  }

  // ─── Build Flow Dots ──────────────────────────────
  buildFlowDots();
}

// ═══════════════════════════════════════════════════════════════════

// ─── Build Flow Dots ────────────────────────────────────────────────
function buildFlowDots() {
  // Clear previous
  while (flowDotsGroup.children.length > 0) {
    var c = flowDotsGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    flowDotsGroup.remove(c);
  }
  flowDots = [];

  edgeLines.forEach(function(ei) {
    // 每条管道放2个光点，间隔半个路径长度，初始进度随机化
    var baseProgress = Math.random();
    for (var i = 0; i < 2; i++) {
      var prog = (baseProgress + i * 0.5) % 1.0;
      var dotGeo = new THREE.SphereGeometry(0.13, 8, 8);
      var dotMat = new THREE.MeshBasicMaterial({
        color: ei.colorHex,
        transparent: true,
        opacity: 0.9,
      });
      var dot = new THREE.Mesh(dotGeo, dotMat);
      var startPos = ei.curve.getPoint(prog);
      dot.position.copy(startPos);
      flowDotsGroup.add(dot);
      flowDots.push({
        mesh: dot,
        edgeInfo: ei,
        progress: prog,
        baseSpeed: 0.2,
        fastSpeed: 0.55,
        speed: 0.2,
      });
    }
  });
}
//  Interaction
// ═══════════════════════════════════════════════════════════════════

function getIntersects(event) {
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Collect all meshes
  var allMeshes = [];
  nodeGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isNode) allMeshes.push(c);
  });
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isPort) allMeshes.push(c);
  });
  return raycaster.intersectObjects(allMeshes);
}

function onMouseMove(event) {
  var intersects = getIntersects(event);
  var found = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      var nm = nodeMeshes[obj.userData.nodeId];
      if (nm) {
        found = nm.data;
        break;
      }
    } else if (obj.userData.isPort) {
      // Show parent node info
      var pnm = nodeMeshes[obj.userData.nodeId];
      if (pnm) {
        found = pnm.data;
        break;
      }
    }
  }

  if (found) {
    var tt = tooltipEl;
    tt.style.display = 'block';
    tt.style.left = (event.clientX + 16) + 'px';
    tt.style.top = (event.clientY - 10) + 'px';
    var html = '<div class="tt-name">' + (found.chineseName || found.label || found.id) + '</div>';
    if (found.label && found.label !== found.id) {
      html += '<div class="tt-desc">' + found.label + '</div>';
    }
    var lk = resolveLayer(found);
    var lCfg = LAYER_CONFIG[lk];
    html += '<div><span class="tt-tag" style="background:#' + (lCfg ? new THREE.Color(lCfg.color).getHexString() : '555') + '44;color:#ccc">' + (lCfg ? lCfg.label : lk) + '</span></div>';
    tt.innerHTML = html;
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tooltipEl.style.display = 'none';
    renderer.domElement.style.cursor = 'default';
  }
}

function onMouseDown(event) {
  _mouseDownPos.x = event.clientX;
  _mouseDownPos.y = event.clientY;
  _isDragging = false;
}

function onMouseUp(event) {
  var dx = event.clientX - _mouseDownPos.x;
  var dy = event.clientY - _mouseDownPos.y;
  if (Math.sqrt(dx*dx + dy*dy) > _dragThreshold) {
    _isDragging = true;
  } else {
    _isDragging = false;
  }
}


// ═══════════════════════════════════════════════════════════════════
//  applyDimming — 3-level visual hierarchy (v0.1.11)
//    - selectedId: node ID of the selected node, or null to reset
//    - Levels: Highlight (selected) > Normal (directly connected) > Dim (rest)
// ═══════════════════════════════════════════════════════════════════

var _savedNodeScales = {}; // nodeId -> original THREE.Vector3 scale (stored as array [x,y,z])

function applyDimming(selectedId) {
  if (selectedId) {
    // ── Build set of directly connected node IDs ──
    var connectedIds = {};
    var selectedEdges = nodeMeshes[selectedId] ? nodeMeshes[selectedId].edges : [];
    selectedEdges.forEach(function(ei) {
      if (ei.fromId === selectedId) connectedIds[ei.toId] = true;
      if (ei.toId === selectedId) connectedIds[ei.fromId] = true;
    });

    // ── Apply 3-level dimming to nodes ──
    Object.keys(nodeMeshes).forEach(function(id) {
      var nm = nodeMeshes[id];
      if (!nm.mesh.visible) return; // skip hidden (aggregated child) nodes
      var mat = nm.mesh.material;

      if (id === selectedId) {
        // Level 1: Highlight — normal color, slight scale-up, strong glow
        mat.emissiveIntensity = 0.5;
        mat.opacity = 1.0;
        // Scale up slightly
        if (!_savedNodeScales[id]) {
          _savedNodeScales[id] = [nm.mesh.scale.x, nm.mesh.scale.y, nm.mesh.scale.z];
        }
        nm.mesh.scale.set(1.15, 1.15, 1.15);
      } else if (connectedIds[id]) {
        // Level 2: Normal — directly connected, restore full appearance
        mat.emissiveIntensity = 0.08;
        mat.opacity = 1.0;
        if (_savedNodeScales[id]) {
          nm.mesh.scale.set(_savedNodeScales[id][0], _savedNodeScales[id][1], _savedNodeScales[id][2]);
          delete _savedNodeScales[id];
        } else {
          nm.mesh.scale.set(1, 1, 1);
        }
      } else {
        // Level 3: Dim — opacity 0.2, no glow
        mat.emissiveIntensity = 0.0;
        mat.opacity = 0.2;
        if (_savedNodeScales[id]) {
          nm.mesh.scale.set(_savedNodeScales[id][0], _savedNodeScales[id][1], _savedNodeScales[id][2]);
          delete _savedNodeScales[id];
        } else {
          nm.mesh.scale.set(1, 1, 1);
        }
      }
    });

    // ── Apply 3-level dimming to edges ──
    edgeLines.forEach(function(ei) {
      var isConnected = (ei.fromId === selectedId || ei.toId === selectedId);
      var lineOpacity = isConnected ? 0.6 : 0.2;
      var glowOpacity = isConnected ? 0.25 : 0.05;
      var coreOpacity = isConnected ? 0.6 : 0.2;

      if (ei.coreTube) ei.coreTube.material.opacity = coreOpacity;
      if (ei.glowTube) ei.glowTube.material.opacity = glowOpacity;
      if (ei.line) ei.line.material.opacity = lineOpacity;
      if (ei.glowLine) ei.glowLine.material.opacity = glowOpacity;
    });

    // ── Dim flow dots ──
    flowDots.forEach(function(fd) {
      var connected = false;
      selectedEdges.forEach(function(ei) {
        if (fd.edgeInfo === ei) connected = true;
      });
      if (connected) {
        fd.speed = fd.fastSpeed;
        fd.mesh.material.opacity = 1.0;
      } else {
        fd.speed = fd.baseSpeed;
        fd.mesh.material.opacity = 0.2;
      }
    });

    // ── Pipe labels: dim non-connected ──
    edgeLines.forEach(function(ei) {
      if (ei._labelObj) {
        ei._labelObj.element.style.opacity = (ei.fromId === selectedId || ei.toId === selectedId) ? '1' : '0.2';
      }
    });

  } else {
    // ── Reset everything to defaults ──
    Object.keys(nodeMeshes).forEach(function(id) {
      var nm = nodeMeshes[id];
      var mat = nm.mesh.material;
      mat.emissiveIntensity = 0.08;
      mat.opacity = 1.0;
      if (_savedNodeScales[id]) {
        nm.mesh.scale.set(_savedNodeScales[id][0], _savedNodeScales[id][1], _savedNodeScales[id][2]);
        delete _savedNodeScales[id];
      } else {
        nm.mesh.scale.set(1, 1, 1);
      }
    });

    edgeLines.forEach(function(ei) {
      if (ei.coreTube) ei.coreTube.material.opacity = 0.25;
      if (ei.glowTube) ei.glowTube.material.opacity = 0.25;
      if (ei.line) ei.line.material.opacity = 0.6;
      if (ei.glowLine) ei.glowLine.material.opacity = 0.25;
      if (ei._labelObj) {
        ei._labelObj.element.style.opacity = '1';
      }
    });

    flowDots.forEach(function(fd) {
      fd.speed = fd.baseSpeed;
      fd.mesh.material.opacity = 0.9;
    });
  }
}

function onClick(event) {
  // Fix 1: Ignore click if it was a drag (OrbitControls rotation)
  if (_isDragging) {
    _isDragging = false;
    return;
  }

  var intersects = getIntersects(event);
  var clickedNodeId = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      clickedNodeId = obj.userData.nodeId;
      break;
    } else if (obj.userData.isPort) {
      clickedNodeId = obj.userData.nodeId;
      break;
    }
  }

  if (!clickedNodeId) {
    // Fix 1: No node clicked — preserve current selection state
    return;
  }

  // Apply 3-level visual dimming (v0.1.11)
  onUserInteraction();
  selectedNodeId = clickedNodeId;
  var nm = nodeMeshes[clickedNodeId];
  applyDimming(selectedNodeId);
  if (nm) {
    updateNodeInfoPanel(nm.data);
  }
}

// ═══════════════════════════════════════════════════════════════════
//  selectUpstreamNode (called from InfoPanel clickable nodes)
// ═══════════════════════════════════════════════════════════════════

function selectUpstreamNode(nid) {
  // Double-click: switch to this node as the selected node
  if (nodeMeshes[nid]) {
    selectedNodeId = nid;
    onUserInteraction();
    applyDimming(nid);
    updateNodeInfoPanel(nodeMeshes[nid].data);
  }
}

function highlightPathway(nid) {
  console.log("[panel] highlight", nid);
  // Single-click: only highlight the pathway, dont switch selected node
  var currentNodeId = selectedNodeId || window._lastDisplayedNodeId || nid;
  if (!currentNodeId) {
    console.log("[panel] highlight skip: no selected node");
    return;
  }
  edgeLines.forEach(function(ei) {
    var conn = ei.conn;
    if (!conn) return;
    var isPathway = (conn.from === currentNodeId && conn.to === nid) ||
                    (conn.from === nid && conn.to === currentNodeId);
    if (ei.coreTube) ei.coreTube.material.opacity = isPathway ? 1.0 : 0.1;
    if (ei.glowTube) ei.glowTube.material.opacity = isPathway ? 0.8 : 0.05;
    if (ei.line) ei.line.material.opacity = isPathway ? 1.0 : 0.2;
    if (ei.glowLine) ei.glowLine.material.opacity = isPathway ? 0.8 : 0.05;
  });
  setTimeout(function() {
    applyDimming(selectedNodeId);
  }, 2000);
}


// ═══════════════════════════════════════════════════════════════════
//  Node Info Panel (Fix 2)
// ═══════════════════════════════════════════════════════════════════

function updateNodeInfoPanel(nodeData) {
  var panel = document.getElementById('nodeInfoPanel');
  if (!nodeData) { panel.style.display = 'none'; return; }
  var nm = null;
  if (selectedNodeId && nodeMeshes && nodeMeshes[selectedNodeId]) nm = nodeMeshes[selectedNodeId];
  var name = nodeData.chineseName || nodeData.label || nodeData.id;
  var desc = nodeData.chineseDesc || nodeData.description || '';
  var layerName = nodeData.layer || '';
  var nodeId = selectedNodeId;
  window._lastDisplayedNodeId = nodeId;

  function getNodeDisplayName(nid) {
    var nd = window.nodeDataMap && window.nodeDataMap[nid];
    return nd ? (nd.chineseName || nd.label || nid) : nid;
  }

  var upstream = [], downstream = [];
  if (window.nodeDataMap && edgeLines) {
    edgeLines.forEach(function(ei) {
      var conn = ei.conn; if (!conn) return;
      if (conn.to === nodeId) upstream.push({ fromNodeId: conn.from, connLabel: conn.label || '', flowType: conn.flowType || 'data' });
      if (conn.from === nodeId) downstream.push({ toNodeId: conn.to, connLabel: conn.label || '', flowType: conn.flowType || 'data' });
    });
  }
  var flowColors = { control: '#4FC3F7', data: '#00BCD4', event: '#E040FB', knowledge: '#7B1FA2' };

  // Pure vertical link diagram (no two-part layout)
  var html = '';
  if (upstream.length > 0) {
    upstream.forEach(function(u) {
      var fc = flowColors[u.flowType] || '#888';
      html += '<div class="ld-row"><div class="ld-node-box ld-upstream-node" ondblclick="handleDblClick(\'' + u.fromNodeId + '\')" onclick="handleClick(\'' + u.fromNodeId + '\')">' + getNodeDisplayName(u.fromNodeId) + '</div></div>';
      html += '<div class="ld-row ld-row-indent"><div class="ld-port-box ld-port-out" style="border-color:' + fc + '">发送:' + u.connLabel + '</div>';
      html += '<div class="ld-flow-badge" style="background:' + fc + ';color:' + (u.flowType==='control'?'#333':'#fff') + '">' + u.flowType + '</div>';
      html += '<div class="ld-arrow ld-arrow-down"><div class="ld-pipe-line-v" style="background:' + fc + '"></div><div class="ld-arrow-head-v" style="border-top-color:' + fc + '"></div></div>';
      html += '<div class="ld-port-box ld-port-in" style="border-color:' + fc + '">接收:' + u.connLabel + '</div></div>';
    });
    html += '<div class="ld-row"><div class="ld-arrow ld-arrow-down"><div class="ld-pipe-line-v" style="background:rgba(255,255,255,0.15)"></div><div class="ld-arrow-head-v" style="border-top-color:rgba(255,255,255,0.25)"></div></div></div>';
  }
  html += '<div class="ld-row ld-row-center"><div class="ld-node-box ld-current-node">' + name + '</div></div>';
  if (layerName) {
    var lCfg = LAYER_CONFIG[layerName];
    html += '<div class="ld-row ld-row-center ld-row-gap"><span class="nip-layer">' + (lCfg ? lCfg.label : layerName) + '</span></div>';
  }
  if (desc) html += '<div class="ld-row ld-row-center ld-row-gap"><span class="nip-desc-text">' + desc + '</span></div>';
  if (downstream.length > 0) {
    html += '<div class="ld-row"><div class="ld-arrow ld-arrow-down"><div class="ld-pipe-line-v" style="background:rgba(255,255,255,0.15)"></div><div class="ld-arrow-head-v" style="border-top-color:rgba(255,255,255,0.25)"></div></div></div>';
    var _seenDownstreamNodes = {};
    downstream.forEach(function(d) {
      var fc = flowColors[d.flowType] || '#888';
      html += '<div class="ld-row ld-row-indent"><div class="ld-port-box ld-port-out" style="border-color:' + fc + '">发送:' + d.connLabel + '</div>';
      html += '<div class="ld-flow-badge" style="background:' + fc + ';color:' + (d.flowType==='control'?'#333':'#fff') + '">' + d.flowType + '</div>';
      html += '<div class="ld-arrow ld-arrow-down"><div class="ld-pipe-line-v" style="background:' + fc + '"></div><div class="ld-arrow-head-v" style="border-top-color:' + fc + '"></div></div>';
      html += '<div class="ld-port-box ld-port-in" style="border-color:' + fc + '">接收:' + d.connLabel + '</div></div>';
      if (!_seenDownstreamNodes[d.toNodeId]) {
        _seenDownstreamNodes[d.toNodeId] = true;
        html += '<div class="ld-row"><div class="ld-arrow ld-arrow-down"><div class="ld-pipe-line-v" style="background:rgba(255,255,255,0.15)"></div><div class="ld-arrow-head-v" style="border-top-color:rgba(255,255,255,0.25)"></div></div>';
        html += '<div class="ld-node-box ld-downstream-node" ondblclick="handleDblClick(\'' + d.toNodeId + '\')" onclick="handleClick(\'' + d.toNodeId + '\')">' + getNodeDisplayName(d.toNodeId) + '</div></div>';
      }
    });
  }
  panel.innerHTML = html;
  panel.style.display = 'block';
}

var _clickTimer = null;
function handleClick(nid) {
  if (_clickTimer) {
    clearTimeout(_clickTimer);
    _clickTimer = null;
  }
  _clickTimer = setTimeout(function() {
    console.log("[panel] click", nid);
    highlightPathway(nid);
    _clickTimer = null;
  }, 300);
}
function handleDblClick(nid) {
  console.log("[panel] dblclick", nid, "selecting:", nid);
  if (_clickTimer) {
    clearTimeout(_clickTimer);
    _clickTimer = null;
  }
  selectUpstreamNode(nid);
}
window.handleClick = handleClick;
window.handleDblClick = handleDblClick;

// ═══════════════════════════════════════════════════════════════════
//  Double-click handler (Fix 1) — deselect only on blank dblclick
// ═══════════════════════════════════════════════════════════════════

function onDblClick(event) {
  // v0.1.10: Check if double-clicking a group node → toggle expand/collapse
  var intersects = getIntersects(event);
  var hitGroupNode = false;
  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      var nid = obj.userData.nodeId;
      if (nodeMeshes[nid] && nodeMeshes[nid].data && nodeMeshes[nid].data._isGroupNode) {
        hitGroupNode = true;
        var grp = AGGREGATION.groupMap[nid];
        if (grp) {
          toggleGroup(nid, window._aggDataNodes, window._aggDataConns, {});
        }
        // Reset selection
        selectedNodeId = null;
        onUserInteraction();
        applyDimming(null);
        updateNodeInfoPanel(null);
        break;
      }
    }
  }
  if (hitGroupNode) return;

  if (!selectedNodeId) return;
  var hitNode = false;
  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode || obj.userData.isPort) {
      hitNode = true;
      break;
    }
  }
  if (!hitNode) {
    // Blank area double-click — deselect
    selectedNodeId = null;
    onUserInteraction();
    applyDimming(null);
    updateNodeInfoPanel(null);
    renderer.domElement.style.cursor = 'default';
  }
}

function onResize() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}

//  Stats
// ═══════════════════════════════════════════════════════════════════

var frameCount = 0;
var lastFpsUpdate = 0;

function updateStats() {
  var now = performance.now();
  frameCount++;
  if (now - lastFpsUpdate >= 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    lastFpsUpdate = now;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════════════

function animate() {
  requestAnimationFrame(animate);

    // --- Idle cam reset (constant-speed lerp) + orbit (v0.1.22) ---
  if (_resetTargetCamPos && _resetTargetLookAt) {
    var now = performance.now() / 1000;
    if (animate._lastCamTime === undefined) animate._lastCamTime = now;
    var delta = Math.min(now - animate._lastCamTime, 0.1);
    animate._lastCamTime = now;
    console.log("[anim] RESET", camera.position.distanceTo(_resetTargetCamPos).toFixed(2));
    var dist = camera.position.distanceTo(_resetTargetCamPos);
    if (dist < 0.3) {
      _resetTargetCamPos = null;
      _resetTargetLookAt = null;
      console.log("[anim] RESET COMPLETE → orbit ON");
      _orbitEnabled = true;
      _idleDelay = 0;       // 重置延时计数，重新计时
    } else {
      var step = Math.min(_resetSpeed * delta, dist);
      var dir = new THREE.Vector3().copy(_resetTargetCamPos).sub(camera.position).normalize();
      camera.position.add(dir.multiplyScalar(step));
      controls.target.lerp(_resetTargetLookAt, 0.05);
      camera.lookAt(controls.target);
    }
    // 复位中不更新 controls，避免覆盖手动设置的摄像机位置
  } else if (_orbitEnabled && !_userInteracting) {
    var pivot = controls.target.clone();
    _orbitAngle += _levelOrbitSpeed;
    camera.position.x = pivot.x + _levelDistance * Math.sin(_orbitAngle);
    camera.position.z = pivot.z + _levelDistance * Math.cos(_orbitAngle);
    camera.position.y = pivot.y + _levelDistance * 0.35;
    camera.lookAt(pivot);
    console.log("[anim] ORBIT", _orbitAngle.toFixed(2));
    controls.update();
  } else {
    controls.update();
    console.log("[anim] IDLE");
  }
  // Make port rings face camera
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.ring) {
      c.userData.ring.lookAt(camera.position);
    }
  });

  // Edge pulse animation
  // 手动计算 delta（避免 clock.getDelta() 干扰 getElapsedTime）
  var now = performance.now() / 1000;
  if (animate._lastTime === undefined) animate._lastTime = now;
  var delta = Math.min(now - animate._lastTime, 0.1);
  animate._lastTime = now;

  var t = clock.getElapsedTime();
  edgeLines.forEach(function(ei, idx) {
    var pulse = 0.5 + 0.3 * Math.sin(t * 0.8 + idx * 0.5);
    if (ei.glowLine) ei.glowLine.material.opacity = 0.15 + 0.2 * pulse;
    if (ei.glowTube) ei.glowTube.material.opacity = 0.15 + 0.2 * pulse;
  });

  // Flow dot animation
  flowDots.forEach(function(fd) {
    fd.progress += fd.speed * delta;
    if (fd.progress > 1.0) fd.progress -= 1.0;
    var pos = fd.edgeInfo.curve.getPoint(fd.progress);
    fd.mesh.position.copy(pos);
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  updateStats();
}
