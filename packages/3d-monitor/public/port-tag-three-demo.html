<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Layer config ──────────────────────────────────────
const LAYER_NAMES=['research','analysis','management','risk','decision'];
const LAYER_COLORS={
  research:new THREE.Color('#4FC3F7'),
  analysis:new THREE.Color('#81C784'),
  management:new THREE.Color('#FFB74D'),
  risk:new THREE.Color('#F44336'),
  decision:new THREE.Color('#CE93D8'),
  infrastructure:new THREE.Color('#4CAF50'),
  frontend:new THREE.Color('#FFB74D'),
  external:new THREE.Color('#FF7043')
};
const FLOW_COLORS={
  data:new THREE.Color('#4CAF50'),
  control:new THREE.Color('#2196F3'),
  request:new THREE.Color('#AB47BC'),
  event:new THREE.Color('#F06292')
};
const DEFAULT_FLOW_COLOR=new THREE.Color('#4CAF50');

// ─── Data state ────────────────────────────────────────
let nodeData=[], edgeData=[];
let NUM_NODES=0, NUM_EDGES=0;

// ─── Three.js setup ────────────────────────────────────
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,500);
camera.position.set(0,18,35);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.08;
controls.target.set(0,0,0);
controls.update();

// ─── Scene objects ─────────────────────────────────────
let nodePoints=null;
let edgeLines=null;
let flowParticles=null;
let highlightMesh=null;

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let selectedNodeIndex=-1;

// ─── Particle state ────────────────────────────────────
let particleData=[];

// ─── Create highlight ring ─────────────────────────────
function createHighlight(){
  const geo=new THREE.RingGeometry(0.45,0.65,32);
  const mat=new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true,opacity:0.8});
  highlightMesh=new THREE.Mesh(geo,mat);
  highlightMesh.visible=false;
  scene.add(highlightMesh);
}

// ─── Grid layout per layer — clean separation ──────────
function computeNodePositions(nodes){
  const count=nodes.length;
  const positions=new Float32Array(count*3);
  // Phase 1: Use node.position if available
  for(let i=0;i<count;i++){
    const p=nodes[i].position;
    if(p&&Array.isArray(p)&&p.length===3){
      positions[i*3]=p[0];
      positions[i*3+1]=p[1];
      positions[i*3+2]=p[2];
    }
  }
  // Phase 2: Layer-based grid for nodes without a pre-set position
  // Build a set of node ids that already have positions
  const positionedIds=new Set();
  for(let i=0;i<count;i++){
    if(positions[i*3]!==0||positions[i*3+1]!==0||positions[i*3+2]!==0){
      positionedIds.add(nodes[i].id);
    }
  }
  const layerNodes={};
  for(const n of nodes){
    if(positionedIds.has(n.id))continue;
    const l=n.layer||'management';
    if(!layerNodes[l])layerNodes[l]=[];
    layerNodes[l].push(n.id);
  }
  const layerZ={research:-16,analysis:-8,management:0,risk:8,decision:16};
  for(const l of LAYER_NAMES){
    const ids=layerNodes[l];
    if(!ids||ids.length===0)continue;
    const n=ids.length;
    const cols=Math.ceil(Math.sqrt(n*1.2));
    const rows=Math.ceil(n/cols);
    const spacing=3.0;
    const ox=-(cols-1)*spacing*0.5;
    const oy=-(rows-1)*spacing*0.5;
    const z0=layerZ[l]||0;
    for(let i=0;i<n;i++){
      const idx=nodes.findIndex(nd=>nd.id===ids[i]);
      if(idx<0)continue;
      const r=Math.floor(i/cols);
      const c=i%cols;
      positions[idx*3]=ox+c*spacing+(Math.random()-0.5)*0.3;
      positions[idx*3+1]=oy+r*spacing+(Math.random()-0.5)*0.3;
      positions[idx*3+2]=z0;
    }
  }
  return positions;
}

// ─── PCB-style orthogonal path routing ─────────────────
function buildOrthogonalPath(x1,y1,z1,x2,y2,z2){
  const midZ=(z1+z2)*0.5;
  const midX=(x1+x2)*0.5;
  const midY=(y1+y2)*0.5;
  const dz=Math.abs(z2-z1);
  const dy=Math.abs(y2-y1);
  const dx=Math.abs(x2-x1);
  const pts=[x1,y1,z1];
  if(dz>dy+dx){pts.push(x1,y1,midZ);pts.push(x2,y2,midZ);}
  else if(dy>dx){pts.push(x1,midY,z1);pts.push(x1,midY,midZ);pts.push(x2,midY,midZ);pts.push(x2,y2,midZ);}
  else{pts.push(midX,y1,z1);pts.push(midX,y1,midZ);pts.push(midX,y2,midZ);pts.push(x2,y2,midZ);}
  pts.push(x2,y2,z2);
  return new Float32Array(pts);
}

// ─── Build nodes (Points) ──────────────────────────────
function buildNodes(nodes){
  const count=nodes.length; NUM_NODES=count;
  const positions=computeNodePositions(nodes);
  const colors=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const layer=nodes[i].layer||'management';
    const col=LAYER_COLORS[layer]||LAYER_COLORS.management;
    colors[i*3]=col.r; colors[i*3+1]=col.g; colors[i*3+2]=col.b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  const mat=new THREE.PointsMaterial({size:0.45,vertexColors:true,transparent:true,opacity:0.9,sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false});
  const points=new THREE.Points(geo,mat);
  points.frustumCulled=false;
  points.userData.nodePositions=positions;
  points.userData.nodeData=nodes;
  return points;
}

// ─── Build edges with orthogonal routing ───────────────
function buildEdges(connections,nodes){
  const nodeMap={};
  for(let i=0;i<nodes.length;i++)nodeMap[nodes[i].id]=i;
  const validEdges=[];
  for(const ec of connections){
    const fi=nodeMap[ec.from],ti=nodeMap[ec.to];
    if(fi!==undefined&&ti!==undefined)validEdges.push({fi,ti,flowType:ec.flowType});
  }
  const count=validEdges.length; NUM_EDGES=count;
  const posAttr=nodePoints.geometry.attributes.position;
  const segPositions=[];
  const segColors=[];
  const edgeInfo=[];
  for(let e=0;e<count;e++){
    const ed=validEdges[e];
    const fi=ed.fi,ti=ed.ti;
    const col=FLOW_COLORS[ed.flowType]||DEFAULT_FLOW_COLOR;
    const x1=posAttr.array[fi*3],y1=posAttr.array[fi*3+1],z1=posAttr.array[fi*3+2];
    const x2=posAttr.array[ti*3],y2=posAttr.array[ti*3+1],z2=posAttr.array[ti*3+2];
    const path=buildOrthogonalPath(x1,y1,z1,x2,y2,z2);
    const pts=path.length/3;
    let totalLen=0;
    const lengths=[];
    for(let p=0;p<pts-1;p++){
      const dx=path[(p+1)*3]-path[p*3];
      const dy=path[(p+1)*3+1]-path[p*3+1];
      const dz=path[(p+1)*3+2]-path[p*3+2];
      const segLen=Math.sqrt(dx*dx+dy*dy+dz*dz);
      lengths.push(segLen);
      totalLen+=segLen;
      segPositions.push(path[p*3],path[p*3+1],path[p*3+2]);
      segPositions.push(path[(p+1)*3],path[(p+1)*3+1],path[(p+1)*3+2]);
      segColors.push(col.r,col.g,col.b,col.r,col.g,col.b);
    }
    edgeInfo.push({segments:lengths,totalLen,color:col});
  }
  let cumSegs=0;
  for(const ei of edgeInfo){ei.pathStartIdx=cumSegs;cumSegs+=ei.segments.length*6;}
  window.__edgeInfo=edgeInfo;
  window.__edgePositions=segPositions;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(segPositions),3));
  geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(segColors),3));
  const mat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.15,depthWrite:false});
  return new THREE.LineSegments(geo,mat);
}

// ─── Build flow particles ──────────────────────────────
function buildFlowParticles(edgeCount){
  const count=Math.max(edgeCount*3,1);
  const positions=new Float32Array(count*3);
  const colors=new Float32Array(count*3);
  particleData=[];
  const eiList=window.__edgeInfo||[];
  for(let i=0;i<count;i++){
    const eiIdx=Math.floor(Math.random()*Math.max(eiList.length,1));
    if(!eiList[eiIdx]||eiList.length===0){positions[i*3]=0;positions[i*3+1]=-100;positions[i*3+2]=0;particleData.push({edgeIdx:0,progress:0,speed:0});continue;}
    const col=eiList[eiIdx].color;
    particleData.push({edgeIdx:eiIdx,progress:Math.random(),speed:0.006+Math.random()*0.008});
    colors[i*3]=col.r;colors[i*3+1]=col.g;colors[i*3+2]=col.b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  const mat=new THREE.PointsMaterial({size:0.3,vertexColors:true,transparent:true,opacity:0.9,sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false});
  const pts=new THREE.Points(geo,mat);
  pts.frustumCulled=false;
  document.getElementById('particleCount').textContent=count;
  return pts;
}

// ─── Update particles each frame ───────────────────────
function updateParticles(time){
  if(!flowParticles||!window.__edgePositions)return;
  const pos=flowParticles.geometry.attributes.position;
  const posArr=pos.array;
  const edgePos=window.__edgePositions;
  const eiList=window.__edgeInfo||[];
  for(let i=0;i<particleData.length;i++){
    const pd=particleData[i];
    if(!eiList[pd.edgeIdx]||eiList.length===0)continue;
    pd.progress+=pd.speed;
    if(pd.progress>1)pd.progress-=1;
    const ei=eiList[pd.edgeIdx];
    const numSegs=ei.segments.length;
    const targetPos=pd.progress*ei.totalLen;
    let accumulated=0;
    let found=false;
    for(let s=0;s<numSegs;s++){
      const segLen=ei.segments[s];
      if(targetPos<=accumulated+segLen||s===numSegs-1){
        const t=segLen>0?(targetPos-accumulated)/segLen:0;
        const baseIdx=ei.pathStartIdx+s*6;
        posArr[i*3]=edgePos[baseIdx]+(edgePos[baseIdx+3]-edgePos[baseIdx])*t;
        posArr[i*3+1]=edgePos[baseIdx+1]+(edgePos[baseIdx+4]-edgePos[baseIdx+1])*t;
        posArr[i*3+2]=edgePos[baseIdx+2]+(edgePos[baseIdx+5]-edgePos[baseIdx+2])*t;
        found=true;break;
      }
      accumulated+=segLen;
    }
    if(!found&&numSegs>0){
      const baseIdx=ei.pathStartIdx+(numSegs-1)*6;
      posArr[i*3]=edgePos[baseIdx+3];posArr[i*3+1]=edgePos[baseIdx+4];posArr[i*3+2]=edgePos[baseIdx+5];
    }
  }
  pos.needsUpdate=true;
}

// ─── Initialize scene ──────────────────────────────────
function initScene(nodes,connections){
  if(nodePoints){scene.remove(nodePoints);nodePoints.geometry.dispose();nodePoints.material.dispose()}
  if(edgeLines){scene.remove(edgeLines);edgeLines.geometry.dispose();edgeLines.material.dispose()}
  if(flowParticles){scene.remove(flowParticles);flowParticles.geometry.dispose();flowParticles.material.dispose()}
  nodeData=nodes; edgeData=connections;
  nodePoints=buildNodes(nodes);
  scene.add(nodePoints);
  edgeLines=buildEdges(connections,nodes);
  scene.add(edgeLines);
  flowParticles=buildFlowParticles(connections.length);
  scene.add(flowParticles);
  if(!highlightMesh)createHighlight();
  document.getElementById('nodeCount').textContent=NUM_NODES;
  document.getElementById('edgeCount').textContent=NUM_EDGES;
}

// ─── Node picking ──────────────────────────────────────
function getNodeUnderPointer(event){
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const intersects=raycaster.intersectObject(nodePoints);
  return intersects.length>0?intersects[0].index:-1;
}

function selectNode(index){
  selectedNodeIndex=index;
  if(index>=0&&highlightMesh){
    const pos=nodePoints.geometry.attributes.position;
    highlightMesh.position.set(pos.array[index*3],pos.array[index*3+1],pos.array[index*3+2]);
    highlightMesh.visible=true;
  }else if(highlightMesh)highlightMesh.visible=false;
}

// ─── Throttled mouse handler ───────────────────────────
let lastMouseTime=0;
function onPointerMove(event){
  const now=performance.now();
  if(now-lastMouseTime<50)return;
  lastMouseTime=now;
  const idx=getNodeUnderPointer(event);
  const tooltip=document.getElementById('tooltip');
  if(idx>=0&&idx<nodeData.length){
    const nd=nodeData[idx];
    tooltip.innerHTML='<div>'+(nd.chineseName||nd.label||nd.id)+'</div><div class="sub">层级: '+(nd.layer||'unknown')+'</div>';
    tooltip.style.display='block';tooltip.style.left=(event.clientX+14)+'px';tooltip.style.top=(event.clientY-10)+'px';
    renderer.domElement.style.cursor='pointer';
  }else{tooltip.style.display='none';renderer.domElement.style.cursor='grab';}
}

function onClick(event){const idx=getNodeUnderPointer(event);selectNode(idx>=0?idx:-1);}

// ─── Resize ────────────────────────────────────────────
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

// ─── Event listeners ───────────────────────────────────
renderer.domElement.addEventListener('pointermove',onPointerMove);
renderer.domElement.addEventListener('click',onClick);

// ─── 60fps render loop (no frame cap) ──────────────────
let frameCount=0, fpsTime=0;
function render(time){
  requestAnimationFrame(render);
  controls.update();
  if(flowParticles)updateParticles(time);
  renderer.render(scene,camera);
  frameCount++;
  if(time-fpsTime>=1000){document.getElementById('fps').textContent=frameCount;frameCount=0;fpsTime=time;}
}

function loadData(){
  const nodes=[],connections=[];
  if(typeof window.__EMBEDDED_DATA__!=='undefined'&&Array.isArray(window.__EMBEDDED_DATA__.nodes)&&Array.isArray(window.__EMBEDDED_DATA__.connections)){
    nodes.push(...window.__EMBEDDED_DATA__.nodes);connections.push(...window.__EMBEDDED_DATA__.connections);
    initScene(nodes,connections);return;
  }
  const sp=new URLSearchParams(window.location.search);
  const encoded=sp.get('data');
  if(encoded){
    try{const data=JSON.parse(decodeURIComponent(encoded));if(Array.isArray(data.nodes)&&Array.isArray(data.connections)){nodes.push(...data.nodes);connections.push(...data.connections);initScene(nodes,connections);return;}}catch(e){}
  }
  const countParam=parseInt(sp.get('count'))||0;
  const totalNodes=countParam>0?countParam:150;
  for(let i=0;i<totalNodes;i++){const layer=LAYER_NAMES[i%5];nodes.push({id:'node_'+i,label:'Node '+i,chineseName:'节点'+i,layer:layer});}
  for(let i=0;i<totalNodes*1.5;i++){const fi=Math.floor(Math.random()*totalNodes);let ti=Math.floor(Math.random()*totalNodes);if(ti===fi)ti=(fi+1)%totalNodes;const types=['data','control','request','event'];connections.push({from:nodes[fi].id,to:nodes[ti].id,flowType:types[Math.floor(Math.random()*4)]});}
  initScene(nodes,connections);
}

// ─── Start ─────────────────────────────────────────────
loadData();
requestAnimationFrame(render);
