  agent:     'business',

  control:  'infrastructure',
  frontend: 'presentation',
  backend:  'business',
  analysis: 'data',
  build:    'infrastructure',

// ─── Infer layer from node identity (v0.1.10) ─────────────────────
function inferLayer(node) {
  var id = (node.id || '').toLowerCase();
  var tags = (node.tags || []).map(function(t) { return t.toLowerCase(); });
  var allText = id + ' ' + tags.join(' ');

  // Check from highest (external) to lowest (infrastructure) priority
  if (/dep-|^external|third.?party|vendor|react|axios|lodash|three/.test(allText)) {
    return 'external';
  }
  if (/component|view|ui|widget|screen|layout|icon|style|css/.test(allText)) {
    return 'presentation';
  }
  if (/page|route|service|controller|logic|middleware|handler|provider/.test(allText)) {
    return 'business';
  }
  if (/api|client|store|data|hook|database|db|model|schema/.test(allText)) {
    return 'data';
  }
  // Default: infrastructure
  return 'infrastructure';
}

/**
 * Resolve the effective layer key for a node.
 * 1) If n.layer exists, try LAYER_ALIAS mapping.
 * 2) Otherwise fall back to inferLayer().
 */
function resolveLayer(n) {
  if (n.layer && LAYER_ALIAS[n.layer]) return LAYER_ALIAS[n.layer];
  if (n.layer && LAYER_CONFIG[n.layer]) return n.layer;
  return inferLayer(n);
}

/**
 * Resolve the effective color for a node.

  var lk = resolveLayer(n);
  var cfg = LAYER_CONFIG[lk];

function buildAggregation(nodes, conns) {

      var p2 = new THREE.Vector3(toPos.x, toPos.y, toPos.z);

      // v0.1.10: Fan spread for same-source edges
      // Compute a small lateral offset based on edge index within same source node
      var fanSpread = 0;
      var sameSourceCount = 0;
      var sameSourceIdx = 0;
      if (dataConns) {
        for (var _si = 0; _si < dataConns.length; _si++) {
          if (dataConns[_si].from === conn.from) {
            sameSourceCount++;
            if (dataConns[_si] === conn) sameSourceIdx = sameSourceCount - 1;
          }
        }
      }
      if (sameSourceCount > 1) {
        // Fan spread: 5-15 degree spread, index-dependent
        var halfSpread = 8 * (Math.PI / 180);
        var fanAngle = -halfSpread + (sameSourceIdx / (sameSourceCount - 1)) * 2 * halfSpread;
        // Apply fan in the XZ plane
        var mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
        var dir = new THREE.Vector3().subVectors(p2, p1).normalize();
        var perp = new THREE.Vector3(-dir.z, 0, dir.x);
        var offsetDist = Math.sin(fanAngle) * p1.distanceTo(p2) * 0.12;
        p1.x += perp.x * offsetDist;
        p1.z += perp.z * offsetDist;
        p2.x -= perp.x * offsetDist;
        p2.z -= perp.z * offsetDist;
        // v0.1.12: Z randomization for fan spread so parallel pipes don't overlap in Z
        var fanZOff = (sameSourceIdx - (sameSourceCount - 1) / 2) * 0.25;
        p1.z += fanZOff;
        p2.z += fanZOff;
      }

      var flowType = conn.flowType || 'data';
      var colorHex = FLOW_COLORS[flowType] || 0x888888;



      // Compute obstacle avoidance
      var nodeIdList = Object.keys(positions);
      var obstacles = findObstacles(conn.from, conn.to, nodeIdList, positions);
      var curve = computeAvoidanceCurve(p1, p2, obstacles, conn.from, conn.to);
      var pts = curve.getPoints(24);

      // v0.1.12: Depth visual — vary pipe opacity by midpoint Z position
      var midPt = curve.getPoint(0.5);
      var pipeDepthFactor = THREE.MathUtils.clamp((midPt.z + 6) / 12, 0, 1);
      var glowOpacity = THREE.MathUtils.clamp(0.25 * (0.8 + pipeDepthFactor * 0.4), 0.15, 0.8);
      var coreOpacity = THREE.MathUtils.clamp(0.6 * (0.8 + pipeDepthFactor * 0.4), 0.15, 0.8);

      // Main glow tube (thicker pipe)
      var tubeGeo = new THREE.TubeGeometry(curve, 20, 0.04, 8, false);
      var glowMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: glowOpacity,
      });
      var glowTube = new THREE.Mesh(tubeGeo, glowMat);
      edgeGroup.add(glowTube);

      // Core bright tube
      var coreTubeGeo = new THREE.TubeGeometry(curve, 20, 0.022, 8, false);
      var coreMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: coreOpacity,
      });
      var coreTube = new THREE.Mesh(coreTubeGeo, coreMat);
      edgeGroup.add(coreTube);

      // Store edge data
      var edgeInfo = {
        line: coreTube,
        glowLine: glowTube,
        glowTube: glowTube,
        coreTube: coreTube,
        conn: conn,
        fromId: conn.from,
        toId: conn.to,
        curve: curve,
        flowType: flowType,
        colorHex: colorHex,
      };
      edgeLines.push(edgeInfo);

      // Create CSS2D text label at mid-point of pipe
      var midPoint = curve.getPoint(0.5);
      var labelDiv = document.createElement('div');
      labelDiv.className = 'pipe-label-3d';
      labelDiv.textContent = conn.label || '';
      // Flow type color
      var labelColor = '#' + new THREE.Color(colorHex).getHexString();
      labelDiv.style.borderColor = labelColor;
      labelDiv.style.color = labelColor;
      var labelObj = new THREE.CSS2DObject(labelDiv);
      labelObj.position.set(midPoint.x, midPoint.y, midPoint.z);
      edgeGroup.add(labelObj);
      // Store label reference for visibility toggling
      edgeInfo._labelObj = labelObj;

      // Link to nodes
      if (nodeMeshes[conn.from]) nodeMeshes[conn.from].edges.push(edgeInfo);
      if (nodeMeshes[conn.to]) nodeMeshes[conn.to].edges.push(edgeInfo);
    });
  }

  document.getElementById('nodeCount').textContent = AGGREGATION.mode === 'none' ? dataNodes.length : (dataNodes.length + ' (' + AGGREGATION._allOriginalNodes.length + ' total)');
  document.getElementById('edgeCount').textContent = dataConns.length;
  // Count active layers
  var activeLayers = {};
  dataNodes.forEach(function(n) { activeLayers[resolveLayer(n)] = true; });
  document.getElementById('layerCount').textContent = Object.keys(activeLayers).length;

  // v0.1.10: Also add child nodes (initially hidden) for fast expand
  if (AGGREGATION.mode !== 'none' && AGGREGATION._allOriginalNodes) {
    var existingIds = {};
    dataNodes.forEach(function(n) { existingIds[n.id] = true; });

    AGGREGATION._allOriginalNodes.forEach(function(n) {
      if (existingIds[n.id]) return; // already in scene
      if (n._isGroupNode) return;
      var pos = positions[n.id];
      if (!pos) return;
      nodeMap[n.id] = n;
      var layerKey = resolveLayer(n);
      var chipColor = resolveLayerColor(n);
      n.layer = layerKey;

      var size = 0.9; // smaller size for child nodes
      var geo = new THREE.BoxGeometry(size, size * 0.5, size);
      // v0.1.12: Depth visual enhancement for child nodes
      var _depthFactor = THREE.MathUtils.clamp((pos.z + 6) / 12, 0, 1);
      var mat = new THREE.MeshStandardMaterial({
        color: chipColor,
        roughness: 0.4,
        metalness: 0.5,
        emissive: chipColor,
        emissiveIntensity: 0.04 + _depthFactor * 0.08,
        transparent: true,
        opacity: 0.70 + _depthFactor * 0.20,
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.nodeId = n.id;
      mesh.userData.isNode = true;
      mesh.visible = false; // hidden initially
      nodeMeshes[n.id] = { mesh: mesh, data: n, ports: [], edges: [] };
      nodeGroup.add(mesh);

      // Label (CSS2D)
      var labelDiv = document.createElement('div');
      labelDiv.className = 'label-2d';
      labelDiv.style.fontSize = '10px';
      labelDiv.style.opacity = '0.6';
      labelDiv.textContent = n.chineseName || n.label || n.id;
      var label = new THREE.CSS2DObject(labelDiv);
      label.position.set(pos.x, pos.y + size * 0.5 + 0.3, pos.z);
      label.userData.nodeId = n.id;
      label.visible = false;
      mesh.userData.labelObj = label;
      nodeGroup.add(label);
    });

    // Also add internal edges (hidden initially)
    if (AGGREGATION._allOriginalConns) {
      AGGREGATION._allOriginalConns.forEach(function(conn) {
        var fromGroup = AGGREGATION.childGroupMap[conn.from];
        var toGroup = AGGREGATION.childGroupMap[conn.to];
        // Only add edges that are inter-child within a group (internal edges)
        if (!fromGroup || !toGroup || fromGroup !== toGroup) return;
        // This is an internal edge within a group
        var fromPos3d = positions[conn.from];
        var toPos3d = positions[conn.to];
        if (!fromPos3d || !toPos3d) return;
        var fp = new THREE.Vector3(fromPos3d.x, fromPos3d.y, fromPos3d.z);
        var tp = new THREE.Vector3(toPos3d.x, toPos3d.y, toPos3d.z);
        var flowType = conn.flowType || 'data';
        var colorHex = FLOW_COLORS[flowType] || 0x888888;
        var internalCurve = new THREE.CubicBezierCurve3(fp, fp.clone().add(new THREE.Vector3(0, 0.5, 0)), tp.clone().add(new THREE.Vector3(0, 0.5, 0)), tp);
        // Thin line for internal edges
        var tubeGeo = new THREE.TubeGeometry(internalCurve, 12, 0.02, 6, false);
        var tubeMat = new THREE.MeshBasicMaterial({
          color: colorHex,
          transparent: true,
          opacity: 0.4,
        });
        var tube = new THREE.Mesh(tubeGeo, tubeMat);
        tube.visible = false;
        edgeGroup.add(tube);
        var ei = {
          line: tube,
          coreTube: tube,
          glowTube: null,
          conn: conn,
          fromId: conn.from,
          toId: conn.to,
          curve: internalCurve,
          flowType: flowType,
          colorHex: colorHex,
          _isInternalEdge: true,
        };
        edgeLines.push(ei);
        if (nodeMeshes[conn.from]) nodeMeshes[conn.from].edges.push(ei);
        if (nodeMeshes[conn.to]) nodeMeshes[conn.to].edges.push(ei);
      });
    }
  }

  // ─── Build Flow Dots ──────────────────────────────
  buildFlowDots();
}

// ═══════════════════════════════════════════════════════════════════

// ─── Build Flow Dots ────────────────────────────────────────────────
function buildFlowDots() {
  // Clear previous
  while (flowDotsGroup.children.length > 0) {
    var c = flowDotsGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    flowDotsGroup.remove(c);
  }
  flowDots = [];

  edgeLines.forEach(function(ei) {
    // 每条管道放2个光点，间隔半个路径长度，初始进度随机化
    var baseProgress = Math.random();
    for (var i = 0; i < 2; i++) {
      var prog = (baseProgress + i * 0.5) % 1.0;
      var dotGeo = new THREE.SphereGeometry(0.13, 8, 8);
      var dotMat = new THREE.MeshBasicMaterial({
        color: ei.colorHex,
        transparent: true,
        opacity: 0.9,
      });
      var dot = new THREE.Mesh(dotGeo, dotMat);
      var startPos = ei.curve.getPoint(prog);
      dot.position.copy(startPos);
      flowDotsGroup.add(dot);
      flowDots.push({
        mesh: dot,
        edgeInfo: ei,
        progress: prog,
        baseSpeed: 0.2,
        fastSpeed: 0.55,
        speed: 0.2,
      });
    }
  });
}
//  Interaction
// ═══════════════════════════════════════════════════════════════════

function getIntersects(event) {
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Collect all meshes
  var allMeshes = [];
  nodeGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isNode) allMeshes.push(c);
  });
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isPort) allMeshes.push(c);
  });
  return raycaster.intersectObjects(allMeshes);
}

function onMouseMove(event) {
  var intersects = getIntersects(event);
  var found = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      var nm = nodeMeshes[obj.userData.nodeId];
      if (nm) {
        found = nm.data;
        break;
      }
    } else if (obj.userData.isPort) {
      // Show parent node info
      var pnm = nodeMeshes[obj.userData.nodeId];
      if (pnm) {
        found = pnm.data;
        break;
      }
    }
  }

  if (found) {
    var tt = tooltipEl;
    tt.style.display = 'block';
    tt.style.left = (event.clientX + 16) + 'px';
    tt.style.top = (event.clientY - 10) + 'px';
    var html = '<div class="tt-name">' + (found.chineseName || found.label || found.id) + '</div>';
    if (found.label && found.label !== found.id) {
      html += '<div class="tt-desc">' + found.label + '</div>';
    }
    var lk = resolveLayer(found);
    var lCfg = LAYER_CONFIG[lk];
    html += '<div><span class="tt-tag" style="background:#' + (lCfg ? new THREE.Color(lCfg.color).getHexString() : '555') + '44;color:#ccc">' + (lCfg ? lCfg.label : lk) + '</span></div>';
    tt.innerHTML = html;
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tooltipEl.style.display = 'none';
    renderer.domElement.style.cursor = 'default';
  }
}

function onMouseDown(event) {
  _mouseDownPos.x = event.clientX;
  _mouseDownPos.y = event.clientY;
  _isDragging = false;
}

function onMouseUp(event) {
  var dx = event.clientX - _mouseDownPos.x;
  var dy = event.clientY - _mouseDownPos.y;
  if (Math.sqrt(dx*dx + dy*dy) > _dragThreshold) {
    _isDragging = true;
  } else {
    _isDragging = false;
  }
}


// ═══════════════════════════════════════════════════════════════════
//  applyDimming — 3-level visual hierarchy (v0.1.11)
//    - selectedId: node ID of the selected node, or null to reset
//    - Levels: Highlight (selected) > Normal (directly connected) > Dim (rest)
// ═══════════════════════════════════════════════════════════════════

var _savedNodeScales = {}; // nodeId -> original THREE.Vector3 scale (stored as array [x,y,z])

function applyDimming(selectedId) {
  if (selectedId) {
    // ── Build set of directly connected node IDs ──
    var connectedIds = {};
    var selectedEdges = nodeMeshes[selectedId] ? nodeMeshes[selectedId].edges : [];
    selectedEdges.forEach(function(ei) {
      if (ei.fromId === selectedId) connectedIds[ei.toId] = true;
      if (ei.toId === selectedId) connectedIds[ei.fromId] = true;
    });

    // ── Apply 3-level dimming to nodes ──
    Object.keys(nodeMeshes).forEach(function(id) {
      var nm = nodeMeshes[id];
      if (!nm.mesh.visible) return; // skip hidden (aggregated child) nodes
      var mat = nm.mesh.material;

      if (id === selectedId) {
        // Level 1: Highlight — normal color, slight scale-up, strong glow
        mat.emissiveIntensity = 0.5;
        mat.opacity = 1.0;
        // Scale up slightly
        if (!_savedNodeScales[id]) {
          _savedNodeScales[id] = [nm.mesh.scale.x, nm.mesh.scale.y, nm.mesh.scale.z];
        }
        nm.mesh.scale.set(1.15, 1.15, 1.15);
      } else if (connectedIds[id]) {
        // Level 2: Normal — directly connected, restore full appearance
        mat.emissiveIntensity = 0.08;
        mat.opacity = 1.0;
        if (_savedNodeScales[id]) {
          nm.mesh.scale.set(_savedNodeScales[id][0], _savedNodeScales[id][1], _savedNodeScales[id][2]);
          delete _savedNodeScales[id];
        } else {
          nm.mesh.scale.set(1, 1, 1);
        }
      } else {
        // Level 3: Dim — opacity 0.2, no glow
        mat.emissiveIntensity = 0.0;
        mat.opacity = 0.2;
        if (_savedNodeScales[id]) {
          nm.mesh.scale.set(_savedNodeScales[id][0], _savedNodeScales[id][1], _savedNodeScales[id][2]);
          delete _savedNodeScales[id];
        } else {
          nm.mesh.scale.set(1, 1, 1);
        }
      }
    });

    // ── Apply 3-level dimming to edges ──
    edgeLines.forEach(function(ei) {
      var isConnected = (ei.fromId === selectedId || ei.toId === selectedId);
      var lineOpacity = isConnected ? 0.6 : 0.2;
      var glowOpacity = isConnected ? 0.25 : 0.05;
      var coreOpacity = isConnected ? 0.6 : 0.2;

      if (ei.coreTube) ei.coreTube.material.opacity = coreOpacity;
      if (ei.glowTube) ei.glowTube.material.opacity = glowOpacity;
      if (ei.line) ei.line.material.opacity = lineOpacity;
      if (ei.glowLine) ei.glowLine.material.opacity = glowOpacity;
    });

    // ── Dim flow dots ──
    flowDots.forEach(function(fd) {
      var connected = false;
      selectedEdges.forEach(function(ei) {
        if (fd.edgeInfo === ei) connected = true;
      });
      if (connected) {
        fd.speed = fd.fastSpeed;
        fd.mesh.material.opacity = 1.0;
      } else {
        fd.speed = fd.baseSpeed;
        fd.mesh.material.opacity = 0.2;
      }
    });

    // ── Pipe labels: dim non-connected ──
    edgeLines.forEach(function(ei) {
      if (ei._labelObj) {
        ei._labelObj.element.style.opacity = (ei.fromId === selectedId || ei.toId === selectedId) ? '1' : '0.2';
      }
    });

  } else {
    // ── Reset everything to defaults ──
    Object.keys(nodeMeshes).forEach(function(id) {
      var nm = nodeMeshes[id];
      var mat = nm.mesh.material;
      mat.emissiveIntensity = 0.08;
      mat.opacity = 1.0;
      if (_savedNodeScales[id]) {
        nm.mesh.scale.set(_savedNodeScales[id][0], _savedNodeScales[id][1], _savedNodeScales[id][2]);
        delete _savedNodeScales[id];
      } else {
        nm.mesh.scale.set(1, 1, 1);
      }
    });

    edgeLines.forEach(function(ei) {
      if (ei.coreTube) ei.coreTube.material.opacity = 0.25;
      if (ei.glowTube) ei.glowTube.material.opacity = 0.25;
      if (ei.line) ei.line.material.opacity = 0.6;
      if (ei.glowLine) ei.glowLine.material.opacity = 0.25;
      if (ei._labelObj) {
        ei._labelObj.element.style.opacity = '1';
      }
    });

    flowDots.forEach(function(fd) {
      fd.speed = fd.baseSpeed;
      fd.mesh.material.opacity = 0.9;
    });
  }
}

function onClick(event) {
  // Fix 1: Ignore click if it was a drag (OrbitControls rotation)
  if (_isDragging) {
    _isDragging = false;
    return;
  }

  var intersects = getIntersects(event);
  var clickedNodeId = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      clickedNodeId = obj.userData.nodeId;
      break;
    } else if (obj.userData.isPort) {
      clickedNodeId = obj.userData.nodeId;
      break;
    }
  }

  if (!clickedNodeId) {
    // Fix 1: No node clicked — preserve current selection state
    return;
  }

  // Apply 3-level visual dimming (v0.1.11)
  onOrbitUserInteract();
  selectedNodeId = clickedNodeId;
  var nm = nodeMeshes[clickedNodeId];
  applyDimming(selectedNodeId);
  if (nm) {
    updateNodeInfoPanel(nm.data);
  }
}

function selectUpstreamNode(nid) {
  // Double-click: switch to this node as the selected node
  if (nodeMeshes[nid]) {
    selectedNodeId = nid;
    onOrbitUserInteract();
    applyDimming(nid);
    updateNodeInfoPanel(nodeMeshes[nid].data);
  }
}

function highlightPathway(nid) {
  // Single-click: only highlight the pathway, dont switch selected node
  var currentNodeId = selectedNodeId || window._lastDisplayedNodeId || nid;
  if (!currentNodeId) {
    return;
  }
  // v0.1.34: if currentNodeId === nid, no selected reference node → skip highlighting
  if (currentNodeId === nid) {
    return;
  }
  edgeLines.forEach(function(ei) {
    var conn = ei.conn;
    if (!conn) return;
    var isPathway = (conn.from === currentNodeId && conn.to === nid) ||
                    (conn.from === nid && conn.to === currentNodeId);
    if (ei.coreTube) ei.coreTube.material.opacity = isPathway ? 1.0 : 0.1;
    if (ei.glowTube) ei.glowTube.material.opacity = isPathway ? 0.8 : 0.05;
    if (ei.line) ei.line.material.opacity = isPathway ? 1.0 : 0.2;
    if (ei.glowLine) ei.glowLine.material.opacity = isPathway ? 0.8 : 0.05;
  });
  setTimeout(function() {
    applyDimming(selectedNodeId);
  }, 2000);
}

      html += '<div class="ld-port-box ld-port-in" style="border-color:' + fc + '">接收:' + u.connLabel + '</div></div>';

    var _seenDownstreamNodes = {};
    downstream.forEach(function(d) {
      var fc = flowColors[d.flowType] || '#888';
      html += '<div class="ld-row ld-row-indent"><div class="ld-port-box ld-port-out" style="border-color:' + fc + '">发送:' + d.connLabel + '</div>';
      html += '<div class="ld-flow-badge" style="background:' + fc + ';color:' + (d.flowType==='control'?'#333':'#fff') + '">' + d.flowType + '</div>';
      html += '<div class="ld-arrow ld-arrow-down"><div class="ld-pipe-line-v" style="background:' + fc + '"></div><div class="ld-arrow-head-v" style="border-top-color:' + fc + '"></div></div>';
      html += '<div class="ld-port-box ld-port-in" style="border-color:' + fc + '">接收:' + d.connLabel + '</div></div>';
      if (!_seenDownstreamNodes[d.toNodeId]) {
        _seenDownstreamNodes[d.toNodeId] = true;
        html += '<div class="ld-row"><div class="ld-arrow ld-arrow-down"><div class="ld-pipe-line-v" style="background:rgba(255,255,255,0.15)"></div><div class="ld-arrow-head-v" style="border-top-color:rgba(255,255,255,0.25)"></div></div>';
        html += '<div class="ld-node-box ld-downstream-node" ondblclick="handleDblClick(\'' + d.toNodeId + '\')" onclick="handleClick(\'' + d.toNodeId + '\')">' + getNodeDisplayName(d.toNodeId) + '</div></div>';
      }
    });
  }
  panel.innerHTML = html;
  panel.style.display = 'block';
}

var _clickTimer = null;
function handleClick(nid) {
  if (_clickTimer) {
    clearTimeout(_clickTimer);
    _clickTimer = null;
  }
  _clickTimer = setTimeout(function() {
    highlightPathway(nid);
    _clickTimer = null;
  }, 300);
}
function handleDblClick(nid) {
  if (_clickTimer) {
    clearTimeout(_clickTimer);
    _clickTimer = null;
  }
  selectUpstreamNode(nid);
}
window.handleDblClick = handleDblClick;
window.handleClick = handleClick;
window.highlightPathway = highlightPathway;
// ═══════════════════════════════════════════════════════════════════
//  Double-click handler (Fix 1) — deselect only on blank dblclick
// ═══════════════════════════════════════════════════════════════════

function onDblClick(event) {
  // v0.1.10: Check if double-clicking a group node → toggle expand/collapse
  var intersects = getIntersects(event);
  var hitGroupNode = false;
  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      var nid = obj.userData.nodeId;
      if (nodeMeshes[nid] && nodeMeshes[nid].data && nodeMeshes[nid].data._isGroupNode) {
        hitGroupNode = true;
        var grp = AGGREGATION.groupMap[nid];
        if (grp) {
          toggleGroup(nid, window._aggDataNodes, window._aggDataConns, {});
        }
        // Reset selection
        selectedNodeId = null;
        onOrbitUserInteract();
        applyDimming(null);
        updateNodeInfoPanel(null);
        break;
      }
    }
  }
  if (hitGroupNode) return;

  if (!selectedNodeId) return;
  var hitNode = false;
  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode || obj.userData.isPort) {
      hitNode = true;
      break;
    }
  }
  if (!hitNode) {
    // Blank area double-click — deselect
    selectedNodeId = null;
    onOrbitUserInteract();
    applyDimming(null);
    updateNodeInfoPanel(null);
    renderer.domElement.style.cursor = 'default';
  }
}

function onResize() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}

// ═══════════════════════════════════════════════════════════════════
//  Stats
// ═══════════════════════════════════════════════════════════════════

var frameCount = 0;
var lastFpsUpdate = 0;

function updateStats() {
  var now = performance.now();
  frameCount++;
  if (now - lastFpsUpdate >= 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    lastFpsUpdate = now;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════════════

function animate() {
  requestAnimationFrame(animate);

  var now = performance.now() / 1000;
  if (animate._lastCamTime === undefined) animate._lastCamTime = now;
  var delta = Math.min(now - animate._lastCamTime, 0.1);
  animate._lastCamTime = now;

  // --- Idle orbit (v0.1.35 — autoRotate + smooth transition) ---
  if (_orbitTransitioning) {
    _orbitTransitionProgress += delta * 0.6; // ~1.7s transition
    if (_orbitTransitionProgress >= 1.0) {
      _orbitTransitionProgress = 1.0;
      _orbitTransitioning = false;
      // Engage autoRotate
      controls.target.copy(_orbitEndTarget);
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.5; // ~24s per rotation at 60fps
      camera.position.copy(_orbitEndPos);
      controls.update();
    } else {
      // Smooth ease-out lerp
      var t = 1 - Math.pow(1 - _orbitTransitionProgress, 3);
      camera.position.lerpVectors(_orbitStartPos, _orbitEndPos, t);
      controls.target.lerpVectors(_orbitStartTarget, _orbitEndTarget, t);
      controls.update();
    }
  } else if (controls.autoRotate && selectedNodeId && nodeMeshes[selectedNodeId]) {
    // During autoRotate: if selected node changes, update target smoothly
    var selPos = nodeMeshes[selectedNodeId].mesh.position;
    controls.target.lerp(selPos, 0.02);
  }
  controls.update();
  // Make port rings face camera
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.ring) {
      c.userData.ring.lookAt(camera.position);
    }
  });
  // Edge pulse animation

  var t = clock.getElapsedTime();
  edgeLines.forEach(function(ei, idx) {
    var pulse = 0.5 + 0.3 * Math.sin(t * 0.8 + idx * 0.5);
    if (ei.glowLine) ei.glowLine.material.opacity = 0.15 + 0.2 * pulse;
    if (ei.glowTube) ei.glowTube.material.opacity = 0.15 + 0.2 * pulse;
  });

  // Flow dot animation
  flowDots.forEach(function(fd) {
    fd.progress += fd.speed * delta;
    if (fd.progress > 1.0) fd.progress -= 1.0;
    var pos = fd.edgeInfo.curve.getPoint(fd.progress);
    fd.mesh.position.copy(pos);
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  updateStats();
}
