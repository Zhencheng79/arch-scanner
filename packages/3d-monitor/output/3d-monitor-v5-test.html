<script>
// ═══════════════════════════════════════════════════════════════════
//  3D Topology Viewer v2 — Chip-style nodes, circuit board feel
// ═══════════════════════════════════════════════════════════════════

(function() {
'use strict';

var scene, camera, renderer, labelRenderer, controls;
var nodeGroup, edgeGroup, portGroup;
var flowDots = [];        // { mesh, edgeInfo, progress, speed }
var flowDotsGroup;
var nodeMeshes = {};      // nodeId -> { mesh, data, ports: [], edges: [] }
var edgeLines = [];       // { line, glowLine, conn, fromId, toId }
var portMeshes = {};      // portId -> mesh
var raycaster, mouse, tooltipEl;
var selectedNodeId = null;
var clock = new THREE.Clock();
var autoRotate = true;
var autoRotateTimer = null;
var autoRotateSpeed = 0.002;
var _mouseDownPos = { x: 0, y: 0 };
var _isDragging = false;
var _dragThreshold = 5; // pixels for drag detection

// ─── Layer config ──────────────────────────────────────────────────
var LAYER_CONFIG = {
  command:  { y: 6,  color: 0xFFEB3B, label: 'Command' },
  control:  { y: 6,  color: 0xFFEB3B, label: 'Control' },
  data:     { y: 3,  color: 0x00BCD4, label: 'Data' },
  analysis: { y: 0,  color: 0x81C784, label: 'Analysis' },
  frontend: { y: 0,  color: 0xFFB74D, label: 'Frontend' },
  backend:  { y: 0,  color: 0x42A5F5, label: 'Backend' },
  feature:  { y: 1,  color: 0x42A5F5, label: 'Feature' },
  build:    { y: -1, color: 0x66BB6A, label: 'Build' },
  config:   { y: -1, color: 0x9E9E9E, label: 'Config' },
  infrastructure: { y: -2, color: 0x4A90D9, label: 'Infra' },
  risk:     { y: 3,  color: 0xF44336, label: 'Risk' },
  decision: { y: 6,  color: 0xCE93D8, label: 'Decision' },
  external: { y: -2, color: 0xFF7043, label: 'External' },
  management: { y: 4, color: 0xFFB74D, label: 'Management' },
};

var FLOW_COLORS = {
  control:  0xFFEB3B,
  data:     0x00BCD4,
  event:    0xE040FB,
  knowledge: 0x7B1FA2,
};

// ═══════════════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════════════

function init() {
  tooltipEl = document.getElementById('tooltip');

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 25, 45);

  // Camera
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(12, 8, 14);
  camera.lookAt(0, 0, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // CSS2D Renderer for labels
  labelRenderer = new THREE.CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);

  // OrbitControls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 4;
  controls.maxDistance = 40;
  controls.target.set(0, 0, 0);
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.addEventListener('start', function() { autoRotate = false; if (autoRotateTimer) { clearTimeout(autoRotateTimer); autoRotateTimer = null; } });
  controls.addEventListener('end', function() {
    if (autoRotateTimer) clearTimeout(autoRotateTimer);
    autoRotateTimer = setTimeout(function() {
      autoRotate = true;
      autoRotateTimer = null;
    }, 6500);
  });

  // Raycaster
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // Groups
  nodeGroup = new THREE.Group();
  edgeGroup = new THREE.Group();
  portGroup = new THREE.Group();
  flowDotsGroup = new THREE.Group();
  scene.add(nodeGroup);
  scene.add(edgeGroup);
  scene.add(portGroup);
  scene.add(flowDotsGroup);

  // Lights
  var ambient = new THREE.AmbientLight(0x404060, 0.6);
  scene.add(ambient);
  var dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);
  var fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
  fillLight.position.set(-10, 5, -10);
  scene.add(fillLight);
  var rimLight = new THREE.DirectionalLight(0xff8844, 0.3);
  rimLight.position.set(0, -10, 15);
  scene.add(rimLight);

  // Grid background (circuit board feel)
  createGrid();

  // Events
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);
  renderer.domElement.addEventListener('dblclick', onDblClick);
  renderer.domElement.addEventListener('mousedown', onMouseDown);
  renderer.domElement.addEventListener('mouseup', onMouseUp);
  window.addEventListener('resize', onResize);

  // Start
  animate();
}

// ─── Grid background ────────────────────────────────────────────────
function createGrid() {
  // Main ground grid
  var gridHelper = new THREE.GridHelper(40, 40, 0x1a3a5a, 0x0d1f33);
  gridHelper.position.y = -3;
  scene.add(gridHelper);

  // Secondary fine grid
  var gridGeo = new THREE.BufferGeometry();
  var step = 0.5;
  var size = 20;
  var points = [];
  for (var i = -size; i <= size; i += step) {
    points.push(-size, -3, i, size, -3, i);
    points.push(i, -3, -size, i, -3, size);
  }
  var fineGrid = new THREE.LineSegments(
    new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(points, 3)),
    new THREE.LineBasicMaterial({ color: 0x0d1f33, transparent: true, opacity: 0.3 })
  );
  scene.add(fineGrid);

  // Circuit board dots at intersections
  var dotGeo = new THREE.BufferGeometry();
  var dotPositions = [];
  for (var x = -size; x <= size; x += 1) {
    for (var z = -size; z <= size; z += 1) {
      dotPositions.push(x, -3, z);
    }
  }
  dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPositions, 3));
  var dotMat = new THREE.PointsMaterial({
    color: 0x1a4a6a,
    size: 0.06,
    transparent: true,
    opacity: 0.4,
  });
  var dots = new THREE.Points(dotGeo, dotMat);
  scene.add(dots);
}

// ═══════════════════════════════════════════════════════════════════
//  Layout — Layer-based stacking with horizontal grid
// ═══════════════════════════════════════════════════════════════════

function computeLayout(nodes) {
  // Group nodes by layer
  var layerMap = {};
  var layerOrder = [];
  nodes.forEach(function(n) {
    var layer = n.layer || 'default';
    if (!layerMap[layer]) {
      layerMap[layer] = [];
      layerOrder.push(layer);
    }
    layerMap[layer].push(n);
  });

  // Sort layers by Y height (highest first)
  layerOrder.sort(function(a, b) {
    var ya = (LAYER_CONFIG[a] || LAYER_CONFIG['default'] || { y: 0 }).y;
    var yb = (LAYER_CONFIG[b] || LAYER_CONFIG['default'] || { y: 0 }).y;
    return yb - ya;
  });

  var spacing = 3.5;
  var positions = {};
  // Track z-offset per y-level to spread overlapping layers apart
  var yLevelZIndex = {};
  var zSpacing = 3.0; // node depth is 1.2, so 3.0 center-to-center = 1.8 edge-to-edge

  layerOrder.forEach(function(layer) {
    var layerNodes = layerMap[layer];
    var yPos = (LAYER_CONFIG[layer] || { y: 0 }).y;
    var count = layerNodes.length;
    var rowWidth = (count - 1) * spacing;

    // Assign z-offset for this y-level (increment for each layer at same y)
    if (yLevelZIndex[yPos] === undefined) yLevelZIndex[yPos] = 0;
    var zOffset = yLevelZIndex[yPos] * zSpacing;
    yLevelZIndex[yPos]++;

    layerNodes.forEach(function(n, i) {
      var xPos = -rowWidth / 2 + i * spacing;
      positions[n.id] = { x: xPos, y: yPos, z: zOffset };
    });
  });

  return positions;
}

// ─── Helpers for pipe obstacle avoidance ──────────────────────────
function getNodeBox(nodeId, positions) {
  var pos = positions[nodeId];
  if (!pos) return null;
  var size = 1.2;
  var margin = 0.08; // small margin for better collision detection
  return {
    minX: pos.x - size * 0.5 - margin,
    maxX: pos.x + size * 0.5 + margin,
    minY: pos.y - size * 0.3 - margin,
    maxY: pos.y + size * 0.3 + margin,
    minZ: pos.z - size * 0.5 - margin,
    maxZ: pos.z + size * 0.5 + margin,
  };
}

function pointInBox(px, py, pz, box) {
  return px >= box.minX && px <= box.maxX &&
         py >= box.minY && py <= box.maxY &&
         pz >= box.minZ && pz <= box.maxZ;
}

function linePenetratesBox(x1, y1, z1, x2, y2, z2, box, steps) {
  steps = steps || 10;
  for (var i = 1; i < steps; i++) {
    var t = i / steps;
    var px = x1 + (x2 - x1) * t;
    var py = y1 + (y2 - y1) * t;
    var pz = z1 + (z2 - z1) * t;
    if (pointInBox(px, py, pz, box)) return true;
  }
  return false;
}

function findObstacles(fromId, toId, nodeIds, positions) {
  var fromPos = positions[fromId];
  var toPos = positions[toId];
  if (!fromPos || !toPos) return [];
  var obstacles = [];
  nodeIds.forEach(function(nid) {
    if (nid === fromId || nid === toId) return;
    var box = getNodeBox(nid, positions);
    if (!box) return;
    if (linePenetratesBox(fromPos.x, fromPos.y, fromPos.z, toPos.x, toPos.y, toPos.z, box, 24)) {
      obstacles.push({ id: nid, box: box, pos: positions[nid] });
    }
  });
  return obstacles;
}

function computeAvoidanceCurve(p1, p2, obstacles) {
  var dist = p1.distanceTo(p2);
  var mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

  if (obstacles.length === 0) {
    var curveHeight = Math.min(dist * 0.2, 2.0);
    var cp1 = new THREE.Vector3(
      mid.x + (p1.z - p2.z) * 0.15,
      mid.y + curveHeight,
      mid.z + (p2.x - p1.x) * 0.15
    );
    var cp2 = new THREE.Vector3(
      mid.x + (p1.z - p2.z) * 0.08,
      mid.y + curveHeight * 0.7,
      mid.z + (p2.x - p1.x) * 0.08
    );
    return new THREE.CubicBezierCurve3(p1, cp1, cp2, p2);
  }

  // ----- Iterative multi-waypoint router -----
  // Build list of waypoints, starting with none (direct curve).
  // If curve still penetrates any obstacle, insert a new waypoint
  // at the midpoint between the segment endpoints closest to the obstacle,
  // pushed away in the best available direction.
  // Repeat until the entire path is clear, with a safety limit.

  var waypoints = []; // intermediate waypoints between p1 and p2
  var maxIter = 8;
  var iter = 0;
  var sampleRes = 24;
  var NODE_RADIUS = 0.68; // slightly more than half diagonal of 1.2x0.72x1.2

  while (iter < maxIter) {
    // Build current full path (p1 -> waypoints[0] -> ... -> waypoints[n-1] -> p2)
    var allPts = buildPathPoints(p1, p2, waypoints, sampleRes);
    var curve = new THREE.CatmullRomCurve3(allPts);

    // Check each obstacle
    var blocked = false;
    var blockedBy = null;
    var blockIdx = -1;
    obstacles.forEach(function(o) {
      if (blocked) return;
      var box = o.box;
      for (var i = 0; i < allPts.length; i++) {
        if (pointInBox(allPts[i].x, allPts[i].y, allPts[i].z, box)) {
          blocked = true;
          blockedBy = o;
          blockIdx = i;
          break;
        }
      }
    });

    if (!blocked) {
      // Clean — return CatmullRom curve that TubeGeometry accepts
      return curve;
    }

    // Insert waypoint to go around the blocking obstacle
    var bPos = blockedBy.pos;

    // Find the two nearest path points to the blockedBy position
    var bestJ = 0;
    var bestDist = Infinity;
    for (var j = 0; j < allPts.length; j++) {
      var d = allPts[j].distanceTo(bPos);
      if (d < bestDist) { bestDist = d; bestJ = j; }
    }

    // Pick a segment (bestJ-1 to bestJ) or (bestJ to bestJ+1) to split
    var segStart = Math.max(0, bestJ - 1);
    var segEnd = Math.min(allPts.length - 1, bestJ + 1);
    var sp = allPts[segStart];
    var ep = allPts[segEnd];

    // Compute push direction: perpendicular to (ep-sp) and away from obstacle centroid
    var dir = new THREE.Vector3().subVectors(ep, sp).normalize();
    var toObs = new THREE.Vector3().subVectors(bPos, sp);
    var perp = new THREE.Vector3().crossVectors(dir, toObs).normalize();
    if (perp.length() < 0.1) {
      // Fallback: push upward
      perp.set(0, 1, 0);
    }

    // Push up if the obstacle is directly in line
    var pushUp = Math.abs(bPos.y - sp.y) < 0.6 ? 2.5 : 0.5;

    var wayPos = new THREE.Vector3().addVectors(sp, ep).multiplyScalar(0.5);
    wayPos.x += perp.x * 3.0;
    wayPos.y += pushUp;
    wayPos.z += perp.z * 3.0;

    // If the waypoint is too close to the obstacle, push further
    var dw = wayPos.distanceTo(bPos);
    if (dw < NODE_RADIUS * 2) {
      var pushAway = new THREE.Vector3().subVectors(wayPos, bPos).normalize();
      wayPos.x += pushAway.x * (NODE_RADIUS * 3 - dw);
      wayPos.y += pushAway.y * (NODE_RADIUS * 3 - dw);
      wayPos.z += pushAway.z * (NODE_RADIUS * 3 - dw);
    }

    // Clamp to not go too far
    wayPos.y = Math.max(wayPos.y, p1.y - 2.0);
    wayPos.y = Math.min(wayPos.y, p1.y + 6.0);

    // Insert the waypoint, maintaining order by projected distance along p1->p2
    var t = new THREE.Vector3().subVectors(wayPos, p1).dot(new THREE.Vector3().subVectors(p2, p1)) / (dist * dist);
    var insertIdx = 0;
    while (insertIdx < waypoints.length && t > waypoints[insertIdx].t) insertIdx++;
    waypoints.splice(insertIdx, 0, { pos: wayPos, t: t });

    iter++;
  }

  // If we exhausted iterations, build the best curve we have
  var allPts = buildPathPoints(p1, p2, waypoints, sampleRes);
  return new THREE.CatmullRomCurve3(allPts);
}

// Helper: build point array for CatmullRom from p1, waypoints, p2
function buildPathPoints(p1, p2, waypoints, samplesPerSeg) {
  samplesPerSeg = samplesPerSeg || 16;
  var result = [];
  var pts = [p1];
  waypoints.sort(function(a, b) { return a.t - b.t; });
  waypoints.forEach(function(w) { pts.push(w.pos); });
  pts.push(p2);
  // Generate smooth CatmullRom points along the full path
  var tmpCurve = new THREE.CatmullRomCurve3(pts);
  var total = tmpCurve.getPoints(samplesPerSeg * pts.length);
  return total;
}
function buildScene(dataNodes, dataConns, dataPorts, dataTags) {
  // Clear
  while (nodeGroup.children.length > 0) nodeGroup.remove(nodeGroup.children[0]);
  while (edgeGroup.children.length > 0) edgeGroup.remove(edgeGroup.children[0]);
  while (portGroup.children.length > 0) portGroup.remove(portGroup.children[0]);
  while (flowDotsGroup.children.length > 0) flowDotsGroup.remove(flowDotsGroup.children[0]);
  nodeMeshes = {};
  edgeLines = [];
  flowDots = [];
  portMeshes = {};
  selectedNodeId = null;
  updateNodeInfoPanel(null);

  if (!dataNodes || dataNodes.length === 0) return;

  var positions = computeLayout(dataNodes);
  var nodeMap = {}; // nodeId -> node data
  window.nodeDataMap = nodeMap; // expose for panel name resolution

  // ─── Build Nodes (Chip cubes) ──────────────────────────
  dataNodes.forEach(function(n) {
    nodeMap[n.id] = n;
    var pos = positions[n.id] || { x: 0, y: 0, z: 0 };
    var layer = n.layer || 'default';
    var layerCfg = LAYER_CONFIG[layer] || LAYER_CONFIG['default'] || { color: 0x888888 };
    var chipColor = n.color ? new THREE.Color(n.color).getHex() : layerCfg.color;

    var size = 1.2;
    var geo = new THREE.BoxGeometry(size, size * 0.6, size);
    var mat = new THREE.MeshStandardMaterial({
      color: chipColor,
      roughness: 0.4,
      metalness: 0.6,
      emissive: chipColor,
      emissiveIntensity: 0.08,
      transparent: true,
      opacity: 0.92,
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, pos.y, pos.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    // Chip detail lines on top
    var lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
    var lineGeo = new THREE.BufferGeometry();
    var s = size * 0.4;
    var yOff = size * 0.3 + 0.01;
    var lPts = [];
    for (var li = -s; li <= s; li += s * 0.5) {
      lPts.push(li, yOff, -s, li, yOff, s);
    }
    for (var lj = -s; lj <= s; lj += s * 0.5) {
      lPts.push(-s, yOff, lj, s, yOff, lj);
    }
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(lPts, 3));
    var lines = new THREE.LineSegments(lineGeo, lineMat);
    mesh.add(lines);

    // Highlight border (edge glow)
    var edgeMat = new THREE.LineBasicMaterial({
      color: chipColor,
      transparent: true,
      opacity: 0.3,
    });
    var edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(size * 1.02, size * 0.62 * 1.02, size * 1.02));
    var edgeWire = new THREE.LineSegments(edgeGeo, edgeMat);
    mesh.add(edgeWire);

    // Store
    mesh.userData.nodeId = n.id;
    mesh.userData.isNode = true;
    nodeMeshes[n.id] = { mesh: mesh, data: n, ports: [], edges: [] };
    nodeGroup.add(mesh);

    // Label (CSS2D)
    var labelDiv = document.createElement('div');
    labelDiv.className = 'label-2d';
    labelDiv.textContent = n.chineseName || n.label || n.id;
    var label = new THREE.CSS2DObject(labelDiv);
    label.position.set(pos.x, pos.y + size * 0.6 + 0.4, pos.z);
    nodeGroup.add(label);
  });

  // ─── Build Ports ───────────────────────────────────────
  var portPositions = {}; // portId -> { x, y, z }

  // Collect ports from both external dataPorts array and inline node.ports
  var allPorts = [];
  if (dataPorts) {
    dataPorts.forEach(function(p) { allPorts.push(p); });
  }
  // Also collect ports defined directly on each node
  dataNodes.forEach(function(n) {
    if (n.ports && n.ports.length > 0) {
      n.ports.forEach(function(p) {
        // Ensure it has a nodeId reference
        if (!p.nodeId) p.nodeId = n.id;
        // Check if already added
        var dup = false;
        for (var pi = 0; pi < allPorts.length; pi++) {
          if (allPorts[pi].portId === p.portId || (allPorts[pi].nodeId === p.nodeId && allPorts[pi].label === p.label && allPorts[pi].type === p.type)) {
            dup = true;
            break;
          }
        }
        if (!dup) allPorts.push(p);
      });
    }
  });

  allPorts.forEach(function(p) {
    var nodeId = p.nodeId;
    var nm = nodeMeshes[nodeId];
    if (!nm) return;
    var pos = nm.mesh.position.clone();
    var sz = 1.2;
    var isOutput = p.type === 'output';
    var portColor = isOutput ? 0xF44336 : 0x4CAF50;
    var radius = 0.12;

    // Determine edge position based on port index
    var portsForNode = nm.ports;
    portsForNode.push(p);
    var idx = portsForNode.length - 1;
    var total = portsForNode.length;

    // Place around the chip edge
    var angle = (idx / Math.max(total, 1)) * Math.PI * 2;
    var edgeX = Math.cos(angle) * sz * 0.55;
    var edgeZ = Math.sin(angle) * sz * 0.55;
    var edgeY = (isOutput ? 1 : -1) * sz * 0.15;

    pos.x += edgeX;
    pos.y += edgeY;
    pos.z += edgeZ;

    portPositions[p.portId] = { x: pos.x, y: pos.y, z: pos.z };

    // Port sphere
    var sphereGeo = new THREE.SphereGeometry(radius, 12, 12);
    var sphereMat = new THREE.MeshStandardMaterial({
      color: portColor,
      emissive: portColor,
      emissiveIntensity: 0.5,
      roughness: 0.3,
      metalness: 0.2,
    });
    var sphere = new THREE.Mesh(sphereGeo, sphereMat);
    sphere.position.copy(pos);
    sphere.userData.portId = p.portId;
    sphere.userData.isPort = true;
    sphere.userData.nodeId = nodeId;
    portGroup.add(sphere);
    portMeshes[p.portId] = sphere;

    // Port glow ring
    var ringGeo = new THREE.RingGeometry(radius * 0.8, radius * 1.8, 16);
    var ringMat = new THREE.MeshBasicMaterial({
      color: portColor,
      transparent: true,
      opacity: 0.2,
      side: THREE.DoubleSide,
    });
    var ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(pos);
    ring.lookAt(camera.position);
    portGroup.add(ring);
    sphere.userData.ring = ring;

    // Store reference on node
    nm.ports.push(p);
  });

  // ─── Build Edges ───────────────────────────────────────
  if (dataConns) {
    dataConns.forEach(function(conn) {
      var fromData = nodeMap[conn.from];
      var toData = nodeMap[conn.to];
      if (!fromData || !toData) return;

      var fromPos = positions[conn.from] || { x: 0, y: 0, z: 0 };
      var toPos = positions[conn.to] || { x: 0, y: 0, z: 0 };

      var p1 = new THREE.Vector3(fromPos.x, fromPos.y, fromPos.z);
      var p2 = new THREE.Vector3(toPos.x, toPos.y, toPos.z);

      var flowType = conn.flowType || 'data';
      var colorHex = FLOW_COLORS[flowType] || 0x888888;



      // Compute obstacle avoidance
      var nodeIdList = Object.keys(positions);
      var obstacles = findObstacles(conn.from, conn.to, nodeIdList, positions);
      var curve = computeAvoidanceCurve(p1, p2, obstacles);
      var pts = curve.getPoints(24);

      // Main glow tube (thicker pipe)
      var tubeGeo = new THREE.TubeGeometry(curve, 20, 0.04, 8, false);
      var glowMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.25,
      });
      var glowTube = new THREE.Mesh(tubeGeo, glowMat);
      edgeGroup.add(glowTube);

      // Core bright tube
      var coreTubeGeo = new THREE.TubeGeometry(curve, 20, 0.022, 8, false);
      var coreMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.6,
      });
      var coreTube = new THREE.Mesh(coreTubeGeo, coreMat);
      edgeGroup.add(coreTube);

      // Store edge data
      var edgeInfo = {
        line: coreTube,
        glowLine: glowTube,
        glowTube: glowTube,
        coreTube: coreTube,
        conn: conn,
        fromId: conn.from,
        toId: conn.to,
        curve: curve,
        flowType: flowType,
        colorHex: colorHex,
      };
      edgeLines.push(edgeInfo);

      // Link to nodes
      if (nodeMeshes[conn.from]) nodeMeshes[conn.from].edges.push(edgeInfo);
      if (nodeMeshes[conn.to]) nodeMeshes[conn.to].edges.push(edgeInfo);
    });
  }

  document.getElementById('nodeCount').textContent = dataNodes.length;
  document.getElementById('edgeCount').textContent = dataConns.length;

  // ─── Build Flow Dots ──────────────────────────────
  buildFlowDots();
}

// ─── Build Flow Dots ────────────────────────────────────────────────
function buildFlowDots() {
  // Clear previous
  while (flowDotsGroup.children.length > 0) {
    var c = flowDotsGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    flowDotsGroup.remove(c);
  }
  flowDots = [];

  edgeLines.forEach(function(ei) {
    // 每条管道放2个光点，间隔半个路径长度，初始进度随机化
    var baseProgress = Math.random();
    for (var i = 0; i < 2; i++) {
      var prog = (baseProgress + i * 0.5) % 1.0;
      var dotGeo = new THREE.SphereGeometry(0.13, 8, 8);
      var dotMat = new THREE.MeshBasicMaterial({
        color: ei.colorHex,
        transparent: true,
        opacity: 0.9,
      });
      var dot = new THREE.Mesh(dotGeo, dotMat);
      var startPos = ei.curve.getPoint(prog);
      dot.position.copy(startPos);
      flowDotsGroup.add(dot);
      flowDots.push({
        mesh: dot,
        edgeInfo: ei,
        progress: prog,
        baseSpeed: 0.2,
        fastSpeed: 0.55,
        speed: 0.2,
      });
    }
  });
}
//  Interaction
// ═══════════════════════════════════════════════════════════════════

function getIntersects(event) {
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Collect all meshes
  var allMeshes = [];
  nodeGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isNode) allMeshes.push(c);
  });
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isPort) allMeshes.push(c);
  });
  return raycaster.intersectObjects(allMeshes);
}

function onMouseMove(event) {
  var intersects = getIntersects(event);
  var found = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      var nm = nodeMeshes[obj.userData.nodeId];
      if (nm) {
        found = nm.data;
        break;
      }
    } else if (obj.userData.isPort) {
      // Show parent node info
      var pnm = nodeMeshes[obj.userData.nodeId];
      if (pnm) {
        found = pnm.data;
        break;
      }
    }
  }

  if (found) {
    var tt = tooltipEl;
    tt.style.display = 'block';
    tt.style.left = (event.clientX + 16) + 'px';
    tt.style.top = (event.clientY - 10) + 'px';
    var html = '<div class="tt-name">' + (found.chineseName || found.label || found.id) + '</div>';
    if (found.label && found.label !== found.id) {
      html += '<div class="tt-desc">' + found.label + '</div>';
    }
    if (found.layer) {
      html += '<div><span class="tt-tag" style="background:' + (LAYER_CONFIG[found.layer] ? '#' + new THREE.Color(LAYER_CONFIG[found.layer].color).getHexString() : '#555') + '44;color:#ccc">' + found.layer + '</span></div>';
    }
    tt.innerHTML = html;
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tooltipEl.style.display = 'none';
    renderer.domElement.style.cursor = 'default';
  }
}

function onMouseDown(event) {
  _mouseDownPos.x = event.clientX;
  _mouseDownPos.y = event.clientY;
  _isDragging = false;
}

function onMouseUp(event) {
  var dx = event.clientX - _mouseDownPos.x;
  var dy = event.clientY - _mouseDownPos.y;
  if (Math.sqrt(dx*dx + dy*dy) > _dragThreshold) {
    _isDragging = true;
  } else {
    _isDragging = false;
  }
}

function onClick(event) {
  // Fix 1: Ignore click if it was a drag (OrbitControls rotation)
  if (_isDragging) {
    _isDragging = false;
    return;
  }

  var intersects = getIntersects(event);
  var clickedNodeId = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      clickedNodeId = obj.userData.nodeId;
      break;
    } else if (obj.userData.isPort) {
      clickedNodeId = obj.userData.nodeId;
      break;
    }
  }

  if (!clickedNodeId) {
    // Fix 1: No node clicked — preserve current selection state
    return;
  }

  // Reset all nodes to default
  Object.keys(nodeMeshes).forEach(function(id) {
    var nm = nodeMeshes[id];
    nm.mesh.material.emissiveIntensity = 0.08;
  });

  // Reset all edges
  edgeLines.forEach(function(ei) {
    if (ei.coreTube) ei.coreTube.material.opacity = 0.25;
    if (ei.glowTube) ei.glowTube.material.opacity = 0.25;
    if (ei.line) ei.line.material.opacity = 0.6;
    if (ei.glowLine) ei.glowLine.material.opacity = 0.25;
  });

  // Reset all flow dots
  flowDots.forEach(function(fd) {
    fd.speed = fd.baseSpeed;
    fd.mesh.material.opacity = 0.9;
  });

  // Select the clicked node
  selectedNodeId = clickedNodeId;
  var nm = nodeMeshes[clickedNodeId];
  if (nm) {
    nm.mesh.material.emissiveIntensity = 0.5;
    updateNodeInfoPanel(nm.data);
    // Highlight connected edges
    nm.edges.forEach(function(ei) {
      ei.line.material.opacity = 1.0;
      if (ei.glowLine) ei.glowLine.material.opacity = 0.6;
      if (ei.glowTube) ei.glowTube.material.opacity = 0.6;
    });
    // 选中节点——加速关联管道光点，暗淡非关联光点
    nm.edges.forEach(function(ei) {
      flowDots.forEach(function(fd) {
        if (fd.edgeInfo === ei) {
          fd.speed = fd.fastSpeed;
          fd.mesh.material.opacity = 1.0;
        }
      });
    });
    flowDots.forEach(function(fd) {
      var connected = false;
      nm.edges.forEach(function(ei) {
        if (fd.edgeInfo === ei) connected = true;
      });
      if (!connected) {
        fd.mesh.material.opacity = 0.2;
      }
    });
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Node Info Panel (Fix 2)
// ═══════════════════════════════════════════════════════════════════

function updateNodeInfoPanel(nodeData) {
  var panel = document.getElementById('nodeInfoPanel');
  if (!nodeData) {
    panel.style.display = 'none';
    return;
  }
  var name = nodeData.chineseName || nodeData.label || nodeData.id;
  var desc = nodeData.chineseDesc || nodeData.description || '';
  var layerName = nodeData.layer || '';
  var html = '<div class="nip-name">' + name + '</div>';
  // Layer info
  if (layerName) {
    html += '<div class="nip-layer">' + layerName + ' 层</div>';
  }
  // Description
  if (desc) {
    html += '<div class="nip-desc">' + desc + '</div>';
  } else {
    html += '<div class="nip-desc" style="color:#666;font-style:italic">暂无描述</div>';
  }
  // Tags
  if (nodeData.tags && nodeData.tags.length > 0) {
    html += '<hr class="nip-divider">';
    html += '<div class="nip-section">🏷 标签</div>';
    html += '<div>';
    nodeData.tags.forEach(function(t) {
      html += '<span class="nip-tag">' + t + '</span>';
    });
    html += '</div>';
  }
  // Ports
  html += '<hr class="nip-divider">';
  html += '<div class="nip-section">🔌 端口</div>';
  if (nodeData.ports && nodeData.ports.length > 0) {
    // Output ports first (red)
    var outputPorts = [];
    var inputPorts = [];
    nodeData.ports.forEach(function(p) {
      if (p.type === 'output' || p.color === '#F44336') {
        outputPorts.push(p);
      } else {
        inputPorts.push(p);
      }
    });
    if (outputPorts.length > 0) {
      html += '<div style="margin-bottom:4px">';
      outputPorts.forEach(function(p) {
        var portLabel = p.label || p.name || p.portId || '未命名';
        var connInfo = '';
        if (p.connectedTo) {
          var targetName = p.connectedTo;
          // try to resolve to chineseName
          if (window.nodeDataMap && window.nodeDataMap[p.connectedTo]) {
            targetName = window.nodeDataMap[p.connectedTo].chineseName || window.nodeDataMap[p.connectedTo].label || p.connectedTo;
          }
          connInfo = ' → ' + targetName;
        }
        html += '<div class="nip-port"><span class="nip-port-dot" style="background:#F44336"></span><span class="nip-port-label">发送: ' + portLabel + '</span><span class="nip-port-conn">' + connInfo + '</span></div>';
      });
      html += '</div>';
    }
    if (inputPorts.length > 0) {
      html += '<div>';
      inputPorts.forEach(function(p) {
        var portLabel = p.label || p.name || p.portId || '未命名';
        var connInfo = '';
        if (p.connectedFrom) {
          var srcName = p.connectedFrom;
          if (window.nodeDataMap && window.nodeDataMap[p.connectedFrom]) {
            srcName = window.nodeDataMap[p.connectedFrom].chineseName || window.nodeDataMap[p.connectedFrom].label || p.connectedFrom;
          }
          connInfo = ' ← ' + srcName;
        }
        html += '<div class="nip-port"><span class="nip-port-dot" style="background:#4CAF50"></span><span class="nip-port-label">接收: ' + portLabel + '</span><span class="nip-port-conn">' + connInfo + '</span></div>';
      });
      html += '</div>';
    }
  } else {
    html += '<div style="color:#666;font-size:12px">暂无端口信息</div>';
  }
  // Submodules
  if (nodeData.subModules && nodeData.subModules.length > 0) {
    html += '<hr class="nip-divider">';
    html += '<div class="nip-section">📦 子模块 (' + nodeData.subModules.length + ')</div>';
  }
  panel.innerHTML = html;
  panel.style.display = 'block';
}

// ═══════════════════════════════════════════════════════════════════
//  Double-click handler (Fix 1) — deselect only on blank dblclick
// ═══════════════════════════════════════════════════════════════════

function onDblClick(event) {
  if (!selectedNodeId) return;
  var intersects = getIntersects(event);
  var hitNode = false;
  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode || obj.userData.isPort) {
      hitNode = true;
      break;
    }
  }
  if (!hitNode) {
    // Blank area double-click — deselect
    selectedNodeId = null;
    // Reset all nodes
    Object.keys(nodeMeshes).forEach(function(id) {
      var nm = nodeMeshes[id];
      nm.mesh.material.emissiveIntensity = 0.08;
    });
    // Reset all edges
    edgeLines.forEach(function(ei) {
      if (ei.coreTube) ei.coreTube.material.opacity = 0.25;
      if (ei.glowTube) ei.glowTube.material.opacity = 0.25;
      if (ei.line) ei.line.material.opacity = 0.6;
      if (ei.glowLine) ei.glowLine.material.opacity = 0.25;
    });
    // Reset all flow dots
    flowDots.forEach(function(fd) {
      fd.speed = fd.baseSpeed;
      fd.mesh.material.opacity = 0.9;
    });
    updateNodeInfoPanel(null);
    renderer.domElement.style.cursor = 'default';
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Resize
// ═══════════════════════════════════════════════════════════════════

function onResize() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}

// ═══════════════════════════════════════════════════════════════════
//  Stats
// ═══════════════════════════════════════════════════════════════════

var frameCount = 0;
var lastFpsUpdate = 0;

function updateStats() {
  var now = performance.now();
  frameCount++;
  if (now - lastFpsUpdate >= 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    lastFpsUpdate = now;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════════════

function animate() {
  requestAnimationFrame(animate);

  // Auto-rotate
  if (autoRotate) {
    var pivot = new THREE.Vector3(0, 0, 0);
    var radius = camera.position.distanceTo(pivot);
    var theta = Math.atan2(camera.position.x, camera.position.z);
    theta += autoRotateSpeed;
    camera.position.x = radius * Math.sin(theta);
    camera.position.z = radius * Math.cos(theta);
    camera.lookAt(pivot);
    controls.update();
  } else {
    controls.update();
  }

  // Make port rings face camera
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.ring) {
      c.userData.ring.lookAt(camera.position);
    }
  });

  // Edge pulse animation
  // 手动计算 delta（避免 clock.getDelta() 干扰 getElapsedTime）
  var now = performance.now() / 1000;
  if (animate._lastTime === undefined) animate._lastTime = now;
  var delta = Math.min(now - animate._lastTime, 0.1);
  animate._lastTime = now;

  var t = clock.getElapsedTime();
  edgeLines.forEach(function(ei, idx) {
    var pulse = 0.5 + 0.3 * Math.sin(t * 0.8 + idx * 0.5);
    if (ei.glowLine) ei.glowLine.material.opacity = 0.15 + 0.2 * pulse;
    if (ei.glowTube) ei.glowTube.material.opacity = 0.15 + 0.2 * pulse;
  });

  // Flow dot animation
  flowDots.forEach(function(fd) {
    fd.progress += fd.speed * delta;
    if (fd.progress > 1.0) fd.progress -= 1.0;
    var pos = fd.edgeInfo.curve.getPoint(fd.progress);
    fd.mesh.position.copy(pos);
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  updateStats();
}

// ═══════════════════════════════════════════════════════════════════
//  Start
// ═══════════════════════════════════════════════════════════════════

init();

var embeddedData = window.__EMBEDDED_DATA__;
if (embeddedData && embeddedData.nodes) {
  buildScene(
    embeddedData.nodes,
    embeddedData.connections || [],
    embeddedData.ports || [],
    embeddedData.tags || {}
  );
  console.log('[3d-monitor] Loaded from embedded data: ' + embeddedData.nodes.length + ' nodes');
} else {
  console.warn('[3d-monitor] No embedded data found (window.__EMBEDDED_DATA__)');
}

})();
</script>
