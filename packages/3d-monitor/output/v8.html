<script>
// ═══════════════════════════════════════════════════════════════════
//  3D Topology Viewer v2 — Chip-style nodes, circuit board feel
// ═══════════════════════════════════════════════════════════════════

(function() {
'use strict';

var scene, camera, renderer, labelRenderer, controls;
var nodeGroup, edgeGroup, portGroup;
var flowDots = [];        // { mesh, edgeInfo, progress, speed }
var flowDotsGroup;
var nodeMeshes = {};      // nodeId -> { mesh, data, ports: [], edges: [] }
var edgeLines = [];       // { line, glowLine, conn, fromId, toId }
var portMeshes = {};      // portId -> mesh
var raycaster, mouse, tooltipEl;
var selectedNodeId = null;
var clock = new THREE.Clock();
var autoRotate = true;
var autoRotateTier = 0;   // 0=off, 1=small, 2=medium, 3=full
var autoRotateTimer = null;
var resetTierTimer = null;
var autoRotateSpeed = 0.002;
var TIER_CONFIG = [
  { delay: 10000, radius: 10, height: 5, speed: 0.0008, label: "小视角" },
  { delay: 20000, radius: 16, height: 8, speed: 0.0015, label: "中视角" },
  { delay: 30000, radius: 22, height: 12, speed: 0.0025, label: "全景环绕" },
];
var _mouseDownPos = { x: 0, y: 0 };
var _isDragging = false;
var _dragThreshold = 5; // pixels for drag detection

// ─── Layer config ──────────────────────────────────────────────────
var LAYER_CONFIG = {
  command:  { y: 6,  color: 0xFFEB3B, label: 'Command' },
  control:  { y: 6,  color: 0xFFEB3B, label: 'Control' },
  data:     { y: 3,  color: 0x00BCD4, label: 'Data' },
  analysis: { y: 0,  color: 0x81C784, label: 'Analysis' },
  frontend: { y: 0,  color: 0xFFB74D, label: 'Frontend' },
  backend:  { y: 0,  color: 0x42A5F5, label: 'Backend' },
  feature:  { y: 1,  color: 0x42A5F5, label: 'Feature' },
  build:    { y: -1, color: 0x66BB6A, label: 'Build' },
  config:   { y: -1, color: 0x9E9E9E, label: 'Config' },
  infrastructure: { y: -2, color: 0x4A90D9, label: 'Infra' },
  risk:     { y: 3,  color: 0xF44336, label: 'Risk' },
  decision: { y: 6,  color: 0xCE93D8, label: 'Decision' },
  external: { y: -2, color: 0xFF7043, label: 'External' },
  management: { y: 4, color: 0xFFB74D, label: 'Management' },
};

var FLOW_COLORS = {
  control:  0xFFEB3B,
  data:     0x00BCD4,
  event:    0xE040FB,
  knowledge: 0x7B1FA2,
};

// ═══════════════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════════════

function init() {
  tooltipEl = document.getElementById('tooltip');

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 25, 45);

  // Camera
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(12, 8, 14);
  camera.lookAt(0, 0, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // CSS2D Renderer for labels
  labelRenderer = new THREE.CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);

  // OrbitControls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 4;
  controls.maxDistance = 40;
  controls.target.set(0, 0, 0);
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.addEventListener('start', function() {
    autoRotate = false;
    autoRotateTier = 0;
    if (autoRotateTimer) { clearTimeout(autoRotateTimer); autoRotateTimer = null; }
    if (resetTierTimer) { clearTimeout(resetTierTimer); resetTierTimer = null; }
  });
  controls.addEventListener('end', function() {
    resetAutoRotateTier();
  });

  // Raycaster
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // Groups
  nodeGroup = new THREE.Group();
  edgeGroup = new THREE.Group();
  portGroup = new THREE.Group();
  flowDotsGroup = new THREE.Group();
  scene.add(nodeGroup);
  scene.add(edgeGroup);
  scene.add(portGroup);
  scene.add(flowDotsGroup);

  // Lights
  var ambient = new THREE.AmbientLight(0x404060, 0.6);
  scene.add(ambient);
  var dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);
  var fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
  fillLight.position.set(-10, 5, -10);
  scene.add(fillLight);
  var rimLight = new THREE.DirectionalLight(0xff8844, 0.3);
  rimLight.position.set(0, -10, 15);
  scene.add(rimLight);


  // Events
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);
  renderer.domElement.addEventListener('dblclick', onDblClick);
  renderer.domElement.addEventListener('mousedown', onMouseDown);
  renderer.domElement.addEventListener('mouseup', onMouseUp);
  window.addEventListener('resize', onResize);

  // Start
  animate();
}


// ═══════════════════════════════════════════════════════════════════
//  Layout — Layer-based stacking with horizontal grid
// ═══════════════════════════════════════════════════════════════════

function computeLayout(nodes) {
  // Group nodes by layer
  var layerMap = {};
  var layerOrder = [];
  nodes.forEach(function(n) {
    var layer = n.layer || 'default';
    if (!layerMap[layer]) {
      layerMap[layer] = [];
      layerOrder.push(layer);
    }
    layerMap[layer].push(n);
  });

  // Sort layers by Y height (highest first)
  layerOrder.sort(function(a, b) {
    var ya = (LAYER_CONFIG[a] || LAYER_CONFIG['default'] || { y: 0 }).y;
    var yb = (LAYER_CONFIG[b] || LAYER_CONFIG['default'] || { y: 0 }).y;
    return yb - ya;
  });

  var spacing = 3.5;
  var positions = {};
  // Track z-offset per y-level to spread overlapping layers apart
  var yLevelZIndex = {};
  var zSpacing = 3.0; // node depth is 1.2, so 3.0 center-to-center = 1.8 edge-to-edge

  layerOrder.forEach(function(layer) {
    var layerNodes = layerMap[layer];
    var yPos = (LAYER_CONFIG[layer] || { y: 0 }).y;
    var count = layerNodes.length;
    var rowWidth = (count - 1) * spacing;

    // Assign z-offset for this y-level (increment for each layer at same y)
    if (yLevelZIndex[yPos] === undefined) yLevelZIndex[yPos] = 0;
    var zOffset = yLevelZIndex[yPos] * zSpacing;
    yLevelZIndex[yPos]++;

    layerNodes.forEach(function(n, i) {
      var xPos = -rowWidth / 2 + i * spacing;
      positions[n.id] = { x: xPos, y: yPos, z: zOffset };
    });
  });

  return positions;
}

// ═══════════════════════════════════════════════════════════════════
//  Build Scene
// ═══════════════════════════════════════════════════════════════════


// ─── Helpers for pipe obstacle avoidance ──────────────────────────
function getNodeBox(nodeId, positions) {
  var pos = positions[nodeId];
  if (!pos) return null;
  var size = 1.2;
  var margin = 0.08; // small margin for better collision detection
  return {
    minX: pos.x - size * 0.5 - margin,
    maxX: pos.x + size * 0.5 + margin,
    minY: pos.y - size * 0.3 - margin,
    maxY: pos.y + size * 0.3 + margin,
    minZ: pos.z - size * 0.5 - margin,
    maxZ: pos.z + size * 0.5 + margin,
  };
}

function pointInBox(px, py, pz, box) {
  return px >= box.minX && px <= box.maxX &&
         py >= box.minY && py <= box.maxY &&
         pz >= box.minZ && pz <= box.maxZ;
}

function linePenetratesBox(x1, y1, z1, x2, y2, z2, box, steps) {
  steps = steps || 10;
  for (var i = 1; i < steps; i++) {
    var t = i / steps;
    var px = x1 + (x2 - x1) * t;
    var py = y1 + (y2 - y1) * t;
    var pz = z1 + (z2 - z1) * t;
    if (pointInBox(px, py, pz, box)) return true;
  }
  return false;
}

function findObstacles(fromId, toId, nodeIds, positions) {
  var fromPos = positions[fromId];
  var toPos = positions[toId];
  if (!fromPos || !toPos) return [];
  var obstacles = [];
  nodeIds.forEach(function(nid) {
    if (nid === fromId || nid === toId) return;
    var box = getNodeBox(nid, positions);
    if (!box) return;
    if (linePenetratesBox(fromPos.x, fromPos.y, fromPos.z, toPos.x, toPos.y, toPos.z, box, 24)) {
      obstacles.push({ id: nid, box: box, pos: positions[nid] });
    }
  });
  return obstacles;
}

// ═══════════════════════════════════════════════════════════════════
//  Pipe-vs-Pipe Crossing Detection & Elevation
// ═══════════════════════════════════════════════════════════════════
// Detect crossing pipes in XZ plane and assign elevation offsets so
// crossing pipes are vertically separated, mimicking PCB routing.
var pipeElevations = {};  // "fromId->toId" -> base elevation offset
var pipeCrossings = [];   // metadata about which pipes cross

function computePipeCrossings(allConns, positions) {
  pipeElevations = {};
  pipeCrossings = [];

  // Build segment list
  var segs = [];
  allConns.forEach(function(conn) {
    var fp = positions[conn.from];
    var tp = positions[conn.to];
    if (!fp || !tp) return;
    var key = conn.from + '->' + conn.to;
    segs.push({
      key: key, from: conn.from, to: conn.to,
      fromPos: fp, toPos: tp,
      dx: tp.x - fp.x, dz: tp.z - fp.z,
    });
  });

  // Check every pair for XZ intersection
  for (var i = 0; i < segs.length; i++) {
    for (var j = i + 1; j < segs.length; j++) {
      var a = segs[i], b = segs[j];
      // Skip if they share an endpoint
      if (a.from === b.from || a.from === b.to || a.to === b.from || a.to === b.to) continue;

      // Line intersection in XZ plane
      var x1 = a.fromPos.x, z1 = a.fromPos.z;
      var x2 = a.toPos.x,   z2 = a.toPos.z;
      var x3 = b.fromPos.x, z3 = b.fromPos.z;
      var x4 = b.toPos.x,   z4 = b.toPos.z;

      var denom = (x1 - x2) * (z3 - z4) - (z1 - z2) * (x3 - x4);
      if (Math.abs(denom) < 0.0001) continue; // parallel

      var t = ((x1 - x3) * (z3 - z4) - (z1 - z3) * (x3 - x4)) / denom;
      var u = -((x1 - x2) * (z1 - z3) - (z1 - z2) * (x1 - x3)) / denom;

      var m = 0.01;
      if (t >= m && t <= 1 - m && u >= m && u <= 1 - m) {
        var cx = x1 + t * (x2 - x1);
        var cz = z1 + t * (z2 - z1);
        pipeCrossings.push({
          pipeA: a.key, pipeB: b.key,
          crossX: cx, crossZ: cz,
          a: a, b: b,
          t: t, u: u,
        });
      }
    }
  }

  // Assign elevation: pipes with more crossings ride higher
  var crossingCount = {};
  pipeCrossings.forEach(function(cr) {
    crossingCount[cr.pipeA] = (crossingCount[cr.pipeA] || 0) + 1;
    crossingCount[cr.pipeB] = (crossingCount[cr.pipeB] || 0) + 1;
  });

  allConns.forEach(function(conn) {
    var key = conn.from + '->' + conn.to;
    var cnt = crossingCount[key] || 0;
    pipeElevations[key] = cnt * 0.3;
  });

  // For each crossing pair, ensure >= 0.5 vertical separation
  pipeCrossings.forEach(function(cr) {
    var elA = pipeElevations[cr.pipeA] || 0;
    var elB = pipeElevations[cr.pipeB] || 0;
    if (Math.abs(elA - elB) < 0.4) {
      // Bump the one with more distance between its endpoints higher
      var distA = cr.a.fromPos.distanceTo ? cr.a.fromPos.distanceTo(cr.a.toPos) : 0;
      var distB = cr.b.fromPos.distanceTo ? cr.b.fromPos.distanceTo(cr.b.toPos) : 0;
      if (distA > distB) {
        pipeElevations[cr.pipeA] = Math.max(elA, elB) + 0.5;
      } else {
        pipeElevations[cr.pipeB] = Math.max(elA, elB) + 0.5;
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════════════
//  Improved Compute Avoidance Curve
// ═══════════════════════════════════════════════════════════════════

function computeAvoidanceCurve(p1, p2, obstacles, fromId, toId) {
  var dist = p1.distanceTo(p2);
  var mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
  var pipeElevKey = (fromId || '') + '->' + (toId || '');
  var baseElev = pipeElevations[pipeElevKey] || 0;

  if (obstacles.length === 0) {
    var curveHeight = Math.min(dist * 0.2, 2.5) + baseElev * 0.15;
    // Add slight lateral spread based on fromId-toId hash
    // so parallel pipes don't overlap
    var hash = 0;
    var keyStr = (fromId || '') + (toId || '');
    for (var _hi = 0; _hi < keyStr.length; _hi++) hash = ((hash << 5) - hash) + keyStr.charCodeAt(_hi);

    var cp1 = new THREE.Vector3(
      mid.x + (p1.z - p2.z) * 0.15 + latSpread,
      mid.y + curveHeight + baseElev,
      mid.z + (p2.x - p1.x) * 0.15 + latSpread

    var cp2 = new THREE.Vector3(
      mid.x + (p1.z - p2.z) * 0.08 + latSpread * 0.6,
      mid.y + curveHeight * 0.7 + baseElev * 0.7,
      mid.z + (p2.x - p1.x) * 0.08 + latSpread * 0.6

  var maxIter = 10;
  var iter = 0;
  var sampleRes = 28;
  var NODE_RADIUS = 0.68;

  while (iter < maxIter) {
    var allPts = buildPathPoints(p1, p2, waypoints, sampleRes);
    var curve = new THREE.CatmullRomCurve3(allPts);

    // Check each obstacle with fine sampling
    var blocked = false;
    var blockedBy = null;
    var blockBestIdx = -1;
    obstacles.forEach(function(o) {
      if (blocked) return;
      var box = o.box;
      // Sample more densely for intersection test
      for (var si = 0; si < allPts.length; si++) {
        if (pointInBox(allPts[si].x, allPts[si].y, allPts[si].z, box)) {
          blocked = true;
          blockedBy = o;
          blockBestIdx = si;
          break;
        }
      }
    });

    if (!blocked) return curve;

    var bPos = blockedBy.pos;

    // Project obstacle onto p1->p2 axis to find where it sits
    var axis = new THREE.Vector3().subVectors(p2, p1);
    var axisLen = axis.length();
    if (axisLen < 0.01) axisLen = 0.01;
    axis.normalize();
    var projT = new THREE.Vector3().subVectors(bPos, p1).dot(axis) / axisLen;
    projT = Math.max(0, Math.min(1, projT));

    // Pick segment around the obstacle
    var segIdx = Math.floor(projT * (allPts.length - 1));
    segIdx = Math.max(1, Math.min(allPts.length - 2, segIdx));
    var sp = allPts[segIdx - 1];
    var ep = allPts[segIdx + 1];
    if (!sp || !ep) { sp = allPts[Math.max(0, segIdx - 1)]; ep = allPts[Math.min(allPts.length - 1, segIdx + 1)]; }

    // Compute push direction: horizontal perpendicular to the segment
    var dir = new THREE.Vector3().subVectors(ep, sp);
    dir.y = 0;
    var dirLen = dir.length();
    if (dirLen < 0.01) {
      dir.set(1, 0, 0);
    } else {
      dir.divideScalar(dirLen);
    }

    var toObs = new THREE.Vector3().subVectors(bPos, sp);
    toObs.y = 0;
    var perp = new THREE.Vector3().crossVectors(dir, toObs);
    perp.y = 0;
    var perpLen = perp.length();
    if (perpLen < 0.01) {
      perp.set(0, 0, 1);
    } else {
      perp.divideScalar(perpLen);
    }

    // Push distance: proportional to obstacle size and centered-ness
    var centerFactor = 1.0 - Math.abs(projT - 0.5) * 1.8;
    centerFactor = Math.max(0.3, centerFactor);
    var pushDist = 2.0 + centerFactor * 2.5;
    var pushUp = 2.5 + baseElev + centerFactor * 1.5;

    var wayPos = new THREE.Vector3().addVectors(sp, ep).multiplyScalar(0.5);
    wayPos.x += perp.x * pushDist;
    wayPos.y += pushUp;
    wayPos.z += perp.z * pushDist;

    // Keep away from obstacle center
    var dw = wayPos.distanceTo(bPos);
    var minDist = NODE_RADIUS * 2.2;
    if (dw < minDist) {
      var pushAway = new THREE.Vector3().subVectors(wayPos, bPos).normalize();
      wayPos.x += pushAway.x * (minDist - dw);
      wayPos.y += pushAway.y * (minDist - dw) * 0.5;
      wayPos.z += pushAway.z * (minDist - dw);
    }

    // Clamp Y to reasonable range (arc over, not drill through)
    var ceilY = Math.max(p1.y, p2.y) + 6.0 + baseElev;
    var floorY = Math.min(p1.y, p2.y) - 2.0;
    wayPos.y = Math.max(floorY, Math.min(ceilY, wayPos.y));

    // Maintain order along path
    var t = new THREE.Vector3().subVectors(wayPos, p1).dot(axis) / axisLen;
    t = Math.max(0, Math.min(1, t));
    var insertIdx = 0;
    while (insertIdx < waypoints.length && t > waypoints[insertIdx].t) insertIdx++;
    if (insertIdx < waypoints.length && Math.abs(t - waypoints[insertIdx].t) < 0.02) {
      t += 0.03;
    }
    waypoints.splice(insertIdx, 0, { pos: wayPos, t: t });

    iter++;
  }

  var allPts = buildPathPoints(p1, p2, waypoints, sampleRes);
  return new THREE.CatmullRomCurve3(allPts);
}

// Helper: build point array for CatmullRom from p1, waypoints, p2
function buildPathPoints(p1, p2, waypoints, samplesPerSeg) {
  samplesPerSeg = samplesPerSeg || 16;
  var pts = [p1];
  waypoints.sort(function(a, b) { return a.t - b.t; });

  var tmpCurve = new THREE.CatmullRomCurve3(pts);
  var total = tmpCurve.getPoints(samplesPerSeg * pts.length);
  return total;
}

// ─── Build Flow Dots ────────────────────────────────────────────────
function buildFlowDots() {
  // Clear previous
  while (flowDotsGroup.children.length > 0) {
    var c = flowDotsGroup.children[0];
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
    flowDotsGroup.remove(c);
  }
  flowDots = [];

  edgeLines.forEach(function(ei) {
    // 每条管道放2个光点，间隔半个路径长度，初始进度随机化
    var baseProgress = Math.random();
    for (var i = 0; i < 2; i++) {
      var prog = (baseProgress + i * 0.5) % 1.0;
      var dotGeo = new THREE.SphereGeometry(0.13, 8, 8);
      var dotMat = new THREE.MeshBasicMaterial({
        color: ei.colorHex,
        transparent: true,
        opacity: 0.9,
      });
      var dot = new THREE.Mesh(dotGeo, dotMat);
      var startPos = ei.curve.getPoint(prog);
      dot.position.copy(startPos);
      flowDotsGroup.add(dot);
      flowDots.push({
        mesh: dot,
        edgeInfo: ei,
        progress: prog,
        baseSpeed: 0.2,
        fastSpeed: 0.55,
        speed: 0.2,
      });
    }
  });
}

function getIntersects(event) {
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Collect all meshes
  var allMeshes = [];
  nodeGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isNode) allMeshes.push(c);
  });
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isPort) allMeshes.push(c);
  });
  return raycaster.intersectObjects(allMeshes);
}

function onMouseMove(event) {
  var intersects = getIntersects(event);
  var found = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      var nm = nodeMeshes[obj.userData.nodeId];
      if (nm) {
        found = nm.data;
        break;
      }
    } else if (obj.userData.isPort) {
      // Show parent node info
      var pnm = nodeMeshes[obj.userData.nodeId];
      if (pnm) {
        found = pnm.data;
        break;
      }
    }
  }

  if (found) {
    var tt = tooltipEl;
    tt.style.display = 'block';
    tt.style.left = (event.clientX + 16) + 'px';
    tt.style.top = (event.clientY - 10) + 'px';
    var html = '<div class="tt-name">' + (found.chineseName || found.label || found.id) + '</div>';
    if (found.label && found.label !== found.id) {
      html += '<div class="tt-desc">' + found.label + '</div>';

    if (found.layer) {
      html += '<div><span class="tt-tag" style="background:' + (LAYER_CONFIG[found.layer] ? '#' + new THREE.Color(LAYER_CONFIG[found.layer].color).getHexString() : '#555') + '44;color:#ccc">' + found.layer + '</span></div>';
    }
    tt.innerHTML = html;

  }
}

function onMouseDown(event) {
  _mouseDownPos.x = event.clientX;
  _mouseDownPos.y = event.clientY;
  _isDragging = false;
}

function onMouseUp(event) {
  var dx = event.clientX - _mouseDownPos.x;
  var dy = event.clientY - _mouseDownPos.y;
  if (Math.sqrt(dx*dx + dy*dy) > _dragThreshold) {
    _isDragging = true;
  } else {
    _isDragging = false;
  }
}

function onClick(event) {
  // Fix 1: Ignore click if it was a drag (OrbitControls rotation)
  if (_isDragging) {
    _isDragging = false;
    return;
  }

  var intersects = getIntersects(event);
  var clickedNodeId = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      clickedNodeId = obj.userData.nodeId;
      break;
    } else if (obj.userData.isPort) {
      clickedNodeId = obj.userData.nodeId;
      break;
    }
  }

  if (!clickedNodeId) {
    // Fix 1: No node clicked — preserve current selection state
    return;
  }

  // Reset all nodes to default
  Object.keys(nodeMeshes).forEach(function(id) {
    var nm = nodeMeshes[id];
    nm.mesh.material.emissiveIntensity = 0.08;
  });

  // Reset all edges
  edgeLines.forEach(function(ei) {
    if (ei.coreTube) ei.coreTube.material.opacity = 0.25;
    if (ei.glowTube) ei.glowTube.material.opacity = 0.25;
    if (ei.line) ei.line.material.opacity = 0.6;
    if (ei.glowLine) ei.glowLine.material.opacity = 0.25;
  });

  // Reset all flow dots
  flowDots.forEach(function(fd) {
    fd.speed = fd.baseSpeed;
    fd.mesh.material.opacity = 0.9;
  });

  // Select the clicked node
  selectedNodeId = clickedNodeId;
  var nm = nodeMeshes[clickedNodeId];
  if (nm) {
    nm.mesh.material.emissiveIntensity = 0.5;
    updateNodeInfoPanel(nm.data);
    // Highlight connected edges
    nm.edges.forEach(function(ei) {
      ei.line.material.opacity = 1.0;
      if (ei.glowLine) ei.glowLine.material.opacity = 0.6;
      if (ei.glowTube) ei.glowTube.material.opacity = 0.6;
    });
    // 选中节点——加速关联管道光点，暗淡非关联光点
    nm.edges.forEach(function(ei) {
      flowDots.forEach(function(fd) {
        if (fd.edgeInfo === ei) {
          fd.speed = fd.fastSpeed;
          fd.mesh.material.opacity = 1.0;
        }
      });
    });
    flowDots.forEach(function(fd) {
      var connected = false;
      nm.edges.forEach(function(ei) {
        if (fd.edgeInfo === ei) connected = true;
      });
      if (!connected) {
        fd.mesh.material.opacity = 0.2;
      }
    });
  }
}

  var downstream = []; // { toNodeId, connLabel, flowType, portLabel }

  // Get node display name helper
  function getNodeDisplayName(nid) {
    var nd = window.nodeDataMap && window.nodeDataMap[nid];
    return nd ? (nd.chineseName || nd.label || nid) : nid;
  }

  // Scan edgeLines to find all connections for this node
  if (window.nodeDataMap && edgeLines) {
    edgeLines.forEach(function(ei) {
      var conn = ei.conn;
      if (!conn) return;
      if (conn.to === nodeId) {
        // This is an incoming connection (upstream)
        var portLabel = '';
        // Find the matching output port on the from node
        if (nm && nm.ports) {
          nm.ports.forEach(function(p) {
            // Input port on current node matching this connection
            if (p.type !== 'output' && p.nodeId === nodeId) {
              // Check if this input port relates to this connection
              // The port label typically contains the same content label
              var labelMatch = conn.label && p.label && p.label.indexOf(conn.label) >= 0;
              if (labelMatch) {
                portLabel = p.label;
              }
            }
          });
        }
        upstream.push({
          fromNodeId: conn.from,
          connLabel: conn.label || '',
          flowType: conn.flowType || 'data',
          portLabel: portLabel || ''
        });
      }
      if (conn.from === nodeId) {
        // This is an outgoing connection (downstream)
        var portLabel = '';
        if (nm && nm.ports) {
          nm.ports.forEach(function(p) {
            if (p.type === 'output' && p.nodeId === nodeId) {
              var labelMatch = conn.label && p.label && p.label.indexOf(conn.label) >= 0;
              if (labelMatch) {
                portLabel = p.label;
              }
            }
          });
        }
        downstream.push({
          toNodeId: conn.to,
          connLabel: conn.label || '',
          flowType: conn.flowType || 'data',
          portLabel: portLabel || ''
        });
      }
    });
  }

  // ── Flow type colors (CSS hex) ──
  var flowColors = {
    control: '#FFEB3B',
    data: '#00BCD4',
    event: '#E040FB',
    knowledge: '#7B1FA2'
  };

  // ── Generate HTML: pure vertical link diagram (Fix 1 - no two-stage) ──
  var html = '';

  // ── Upstream section ──
  if (upstream.length > 0) {
    html += '<div class="ld-flow-section">';
    if (upstream.length > 1) {
      html += '<div class="ld-multi-label">⬆ 上级节点 ' + upstream.length + '个</div>';
    }
    upstream.forEach(function(u, idx) {
      var fc = flowColors[u.flowType] || '#888';
      html += '<div class="ld-flow-row">';
      html += '<div class="ld-node-box ld-upstream-node">' + getNodeDisplayName(u.fromNodeId) + '</div>';
      html += '</div>';
      html += '<div class="ld-arrow-down">';
      html += '<div class="ld-vline" style="background:' + fc + '"></div>';
      html += '<div class="ld-arrowhead-down" style="border-top-color:' + fc + '"></div>';
      html += '</div>';
      html += '<div class="ld-conn-row">';
      html += '<div class="ld-port-box ld-port-box-out">↻ ' + (u.portLabel || '发送') + '</div>';
      html += '<div class="ld-conn-arrow">';
      html += '<div class="ld-conn-line" style="background:' + fc + '"></div>';
      html += '<div class="ld-conn-head" style="border-left-color:' + fc + '"></div>';
      html += '</div>';
      if (u.connLabel) {
        html += '<span class="ld-row-label" style="color:' + fc + '">' + u.connLabel + '</span>';
      }
      html += '<div class="ld-flow-badge" style="background:' + fc + ';color:' + (u.flowType==='control'?'#333':'#fff') + '">' + u.flowType + '</div>';
      html += '<div class="ld-port-box ld-port-box-in">⇁ ' + (u.portLabel || '接收') + '</div>';
      html += '</div>';
    });
  }

  // ── Current node (always shown) ──
  if (upstream.length > 0) {
    html += '<div class="ld-arrow-down">';
    html += '<div class="ld-vline" style="background:#888"></div>';
    html += '<div class="ld-arrowhead-down" style="border-top-color:#888"></div>';
    html += '</div>';
  }
  html += '<div class="ld-flow-row">';
  html += '<div class="ld-node-box ld-current-node">' + name + '</div>';
  html += '</div>';
  if (desc) {
    html += '<div class="ld-current-desc">' + desc + '</div>';
  }
  if (layerName) {
    html += '<div style="text-align:center;font-size:10px;color:#666;margin-bottom:2px">' + layerName + ' 层</div>';
  }

  // ── Downstream section ──
  if (downstream.length > 0) {
    html += '<div class="ld-arrow-down">';
    html += '<div class="ld-vline" style="background:#888"></div>';
    html += '<div class="ld-arrowhead-down" style="border-top-color:#888"></div>';
    html += '</div>';
    html += '<div class="ld-flow-section">';
    if (downstream.length > 1) {
      html += '<div class="ld-multi-label">⬇ 下级节点 ' + downstream.length + '个</div>';
    }
    downstream.forEach(function(d, idx) {
      var fc = flowColors[d.flowType] || '#888';
      html += '<div class="ld-conn-row">';
      html += '<div class="ld-port-box ld-port-box-out">⇀ ' + (d.portLabel || '发送') + '</div>';
      html += '<div class="ld-conn-arrow">';
      html += '<div class="ld-conn-line" style="background:' + fc + '"></div>';
      html += '<div class="ld-conn-head" style="border-left-color:' + fc + '"></div>';
      html += '</div>';
      if (d.connLabel) {
        html += '<span class="ld-row-label" style="color:' + fc + '">' + d.connLabel + '</span>';
      }
      html += '<div class="ld-flow-badge" style="background:' + fc + ';color:' + (d.flowType==='control'?'#333':'#fff') + '">' + d.flowType + '</div>';
      html += '<div class="ld-port-box ld-port-box-in">⇁ ' + (d.portLabel || '接收') + '</div>';
      html += '</div>';
      html += '<div class="ld-arrow-down">';
      html += '<div class="ld-vline" style="background:' + fc + '"></div>';
      html += '<div class="ld-arrowhead-down" style="border-top-color:' + fc + '"></div>';
      html += '</div>';
      html += '<div class="ld-flow-row">';
      html += '<div class="ld-node-box ld-downstream-node">' + getNodeDisplayName(d.toNodeId) + '</div>';
      html += '</div>';
    });
  }

  html += '</div>';

  panel.innerHTML = html;
  panel.style.display = 'block';
}

// ═══════════════════════════════════════════════════════════════════
//  Double-click handler (Fix 1) — deselect only on blank dblclick
// ═══════════════════════════════════════════════════════════════════

function onDblClick(event) {
  if (!selectedNodeId) return;
  var intersects = getIntersects(event);
  var hitNode = false;
  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode || obj.userData.isPort) {
      hitNode = true;
      break;
    }
  }
  if (!hitNode) {
    // Blank area double-click — deselect
    selectedNodeId = null;
    // Reset all nodes
    Object.keys(nodeMeshes).forEach(function(id) {
      var nm = nodeMeshes[id];
      nm.mesh.material.emissiveIntensity = 0.08;
    });
    // Reset all edges
    edgeLines.forEach(function(ei) {
      if (ei.coreTube) ei.coreTube.material.opacity = 0.25;
      if (ei.glowTube) ei.glowTube.material.opacity = 0.25;
      if (ei.line) ei.line.material.opacity = 0.6;
      if (ei.glowLine) ei.glowLine.material.opacity = 0.25;
    });
    // Reset all flow dots
    flowDots.forEach(function(fd) {
      fd.speed = fd.baseSpeed;
      fd.mesh.material.opacity = 0.9;
    });
    updateNodeInfoPanel(null);
    renderer.domElement.style.cursor = 'default';
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Resize
// ═══════════════════════════════════════════════════════════════════

function onResize() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}

// ═══════════════════════════════════════════════════════════════════
//  Stats
// ═══════════════════════════════════════════════════════════════════

var frameCount = 0;
var lastFpsUpdate = 0;

function updateStats() {
  var now = performance.now();
  frameCount++;
  if (now - lastFpsUpdate >= 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    lastFpsUpdate = now;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Graded Camera Reset (Fix 2)
// ═══════════════════════════════════════════════════════════════════

function resetAutoRotateTier() {
  // Clear existing timers
  if (autoRotateTimer) { clearTimeout(autoRotateTimer); autoRotateTimer = null; }
  if (resetTierTimer) { clearTimeout(resetTierTimer); resetTierTimer = null; }

  autoRotateTier = 0;

  // Start cascade: tier 1 after 10s, tier 2 after 20s, tier 3 after 30s
  // Delays in TIER_CONFIG are cumulative: 10000, 20000, 30000 = seconds from now
  function scheduleTier(tierIndex) {
    if (tierIndex >= 3) return;
    var timeFromNow = TIER_CONFIG[tierIndex].delay;
    // Subtract accumulated time from previous tiers
    var prevDelay = tierIndex > 0 ? TIER_CONFIG[tierIndex - 1].delay : 0;
    var waitMs = timeFromNow - prevDelay;
    resetTierTimer = setTimeout(function() {
      autoRotateTier = tierIndex + 1;
      autoRotate = true;
      // Schedule next tier
      scheduleTier(tierIndex + 1);
    }, waitMs);
  }

  // Kick off tier 1 after 10s
  scheduleTier(0);
}

// ═══════════════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════════════

function animate() {
  requestAnimationFrame(animate);

  // Auto-rotate with tiered reset (Fix 2)
  if (autoRotate && autoRotateTier > 0) {
    var tierIdx = autoRotateTier - 1;
    var cfg = TIER_CONFIG[tierIdx];
    // Determine orbit center
    var pivot;
    if (selectedNodeId && nodeMeshes[selectedNodeId]) {
      pivot = nodeMeshes[selectedNodeId].mesh.position.clone();
    } else {
      pivot = new THREE.Vector3(0, 0, 0);
    }
    // Smoothly transition camera to target radius/height
    var targetDist = cfg.radius;
    var targetHeight = cfg.height;
    var currentDist = camera.position.distanceTo(pivot);
    var lerpFactor = 0.02;
    var newDist = currentDist + (targetDist - currentDist) * lerpFactor;
    var currentHeight = camera.position.y;
    var newHeight = currentHeight + (targetHeight - currentHeight) * lerpFactor;
    // Rotate around pivot
    var theta = Math.atan2(camera.position.x - pivot.x, camera.position.z - pivot.z);
    theta += cfg.speed * (tierIdx + 1);
    var relX = newDist * Math.sin(theta);
    var relZ = newDist * Math.cos(theta);
    camera.position.x = pivot.x + relX;
    camera.position.y = pivot.y + newHeight;
    camera.position.z = pivot.z + relZ;
    camera.lookAt(pivot);
    controls.target.copy(pivot);
    controls.update();
  } else {
    controls.update();
  }

  // Make port rings face camera
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.ring) {
      c.userData.ring.lookAt(camera.position);
    }
  });

  // Edge pulse animation
  // 手动计算 delta（避免 clock.getDelta() 干扰 getElapsedTime）
  var now = performance.now() / 1000;
  if (animate._lastTime === undefined) animate._lastTime = now;
  var delta = Math.min(now - animate._lastTime, 0.1);
  animate._lastTime = now;

  var t = clock.getElapsedTime();
  edgeLines.forEach(function(ei, idx) {
    var pulse = 0.5 + 0.3 * Math.sin(t * 0.8 + idx * 0.5);
    if (ei.glowLine) ei.glowLine.material.opacity = 0.15 + 0.2 * pulse;
    if (ei.glowTube) ei.glowTube.material.opacity = 0.15 + 0.2 * pulse;
  });

  // Flow dot animation
  flowDots.forEach(function(fd) {
    fd.progress += fd.speed * delta;
    if (fd.progress > 1.0) fd.progress -= 1.0;
    var pos = fd.edgeInfo.curve.getPoint(fd.progress);
    fd.mesh.position.copy(pos);
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  updateStats();
}

// ═══════════════════════════════════════════════════════════════════
//  Start

// ═══════════════════════════════════════════════════════════════════

init();

// Start graded reset timer
resetAutoRotateTier();

var embeddedData = window.__EMBEDDED_DATA__;
if (embeddedData && embeddedData.nodes) {
  buildScene(
    embeddedData.nodes,
    embeddedData.connections || [],
    embeddedData.ports || [],
    embeddedData.tags || {}
  );
  console.log('[3d-monitor] Loaded from embedded data: ' + embeddedData.nodes.length + ' nodes');
} else {
  console.warn('[3d-monitor] No embedded data found (window.__EMBEDDED_DATA__)');
}

})();
</script>
