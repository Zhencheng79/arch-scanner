<script>
// ═══════════════════════════════════════════════════════════════════
//  3D Topology Viewer v2 — Chip-style nodes, circuit board feel
// ═══════════════════════════════════════════════════════════════════

(function() {
'use strict';

var scene, camera, renderer, labelRenderer, controls;
var nodeGroup, edgeGroup, portGroup;
var nodeMeshes = {};      // nodeId -> { mesh, data, ports: [], edges: [] }
var edgeLines = [];       // { line, glowLine, conn, fromId, toId }
var portMeshes = {};      // portId -> mesh
var raycaster, mouse, tooltipEl;
var selectedNodeId = null;
var clock = new THREE.Clock();
var autoRotate = true;
var autoRotateTimer = null;
var autoRotateSpeed = 0.002;

// ─── Layer config ──────────────────────────────────────────────────
var LAYER_CONFIG = {
  command:  { y: 6,  color: 0xFFEB3B, label: 'Command' },
  control:  { y: 6,  color: 0xFFEB3B, label: 'Control' },
  data:     { y: 3,  color: 0x00BCD4, label: 'Data' },
  analysis: { y: 0,  color: 0x81C784, label: 'Analysis' },
  frontend: { y: 0,  color: 0xFFB74D, label: 'Frontend' },
  backend:  { y: 0,  color: 0x42A5F5, label: 'Backend' },
  feature:  { y: 1,  color: 0x42A5F5, label: 'Feature' },
  build:    { y: -1, color: 0x66BB6A, label: 'Build' },
  config:   { y: -1, color: 0x9E9E9E, label: 'Config' },
  infrastructure: { y: -2, color: 0x4A90D9, label: 'Infra' },
  risk:     { y: 3,  color: 0xF44336, label: 'Risk' },
  decision: { y: 6,  color: 0xCE93D8, label: 'Decision' },
  external: { y: -2, color: 0xFF7043, label: 'External' },
  management: { y: 4, color: 0xFFB74D, label: 'Management' },
};

var FLOW_COLORS = {
  control:  0xFFEB3B,
  data:     0x00BCD4,
  event:    0xE040FB,
  knowledge: 0x7B1FA2,
};

// ═══════════════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════════════

function init() {
  tooltipEl = document.getElementById('tooltip');

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a12);
  scene.fog = new THREE.Fog(0x0a0a12, 25, 45);

  // Camera
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(12, 8, 14);
  camera.lookAt(0, 0, 0);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.body.appendChild(renderer.domElement);

  // CSS2D Renderer for labels
  labelRenderer = new THREE.CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.body.appendChild(labelRenderer.domElement);

  // OrbitControls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 4;
  controls.maxDistance = 40;
  controls.target.set(0, 0, 0);
  controls.maxPolarAngle = Math.PI / 2.1;
  controls.addEventListener('start', function() { autoRotate = false; if (autoRotateTimer) { clearTimeout(autoRotateTimer); autoRotateTimer = null; } });
  controls.addEventListener('end', function() {
    if (autoRotateTimer) clearTimeout(autoRotateTimer);
    autoRotateTimer = setTimeout(function() {
      autoRotate = true;
      autoRotateTimer = null;
    }, 6500);
  });

  // Raycaster
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // Groups
  nodeGroup = new THREE.Group();
  edgeGroup = new THREE.Group();
  portGroup = new THREE.Group();
  scene.add(nodeGroup);
  scene.add(edgeGroup);
  scene.add(portGroup);

  // Lights
  var ambient = new THREE.AmbientLight(0x404060, 0.6);
  scene.add(ambient);
  var dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);
  var fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
  fillLight.position.set(-10, 5, -10);
  scene.add(fillLight);
  var rimLight = new THREE.DirectionalLight(0xff8844, 0.3);
  rimLight.position.set(0, -10, 15);
  scene.add(rimLight);

  // Grid background (circuit board feel)
  createGrid();

  // Events
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);
  window.addEventListener('resize', onResize);

  // Start
  animate();
}

// ─── Grid background ────────────────────────────────────────────────
function createGrid() {
  // Main ground grid
  var gridHelper = new THREE.GridHelper(40, 40, 0x1a3a5a, 0x0d1f33);
  gridHelper.position.y = -3;
  scene.add(gridHelper);

  // Secondary fine grid
  var gridGeo = new THREE.BufferGeometry();
  var step = 0.5;
  var size = 20;
  var points = [];
  for (var i = -size; i <= size; i += step) {
    points.push(-size, -3, i, size, -3, i);
    points.push(i, -3, -size, i, -3, size);
  }
  var fineGrid = new THREE.LineSegments(
    new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(points, 3)),
    new THREE.LineBasicMaterial({ color: 0x0d1f33, transparent: true, opacity: 0.3 })
  );
  scene.add(fineGrid);

  // Circuit board dots at intersections
  var dotGeo = new THREE.BufferGeometry();
  var dotPositions = [];
  for (var x = -size; x <= size; x += 1) {
    for (var z = -size; z <= size; z += 1) {
      dotPositions.push(x, -3, z);
    }
  }
  dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(dotPositions, 3));
  var dotMat = new THREE.PointsMaterial({
    color: 0x1a4a6a,
    size: 0.06,
    transparent: true,
    opacity: 0.4,
  });
  var dots = new THREE.Points(dotGeo, dotMat);
  scene.add(dots);
}

// ═══════════════════════════════════════════════════════════════════
//  Layout — Layer-based stacking with horizontal grid
// ═══════════════════════════════════════════════════════════════════

function computeLayout(nodes) {
  // Group nodes by layer
  var layerMap = {};
  var layerOrder = [];
  nodes.forEach(function(n) {
    var layer = n.layer || 'default';
    if (!layerMap[layer]) {
      layerMap[layer] = [];
      layerOrder.push(layer);
    }
    layerMap[layer].push(n);
  });

  // Sort layers by Y height (highest first)
  layerOrder.sort(function(a, b) {
    var ya = (LAYER_CONFIG[a] || LAYER_CONFIG['default'] || { y: 0 }).y;
    var yb = (LAYER_CONFIG[b] || LAYER_CONFIG['default'] || { y: 0 }).y;
    return yb - ya;
  });

  var spacing = 3.5;
  var positions = {};
  // Track z-offset per y-level to spread overlapping layers apart
  var yLevelZIndex = {};
  var zSpacing = 3.0; // node depth is 1.2, so 3.0 center-to-center = 1.8 edge-to-edge

  layerOrder.forEach(function(layer) {
    var layerNodes = layerMap[layer];
    var yPos = (LAYER_CONFIG[layer] || { y: 0 }).y;
    var count = layerNodes.length;
    var rowWidth = (count - 1) * spacing;

    // Assign z-offset for this y-level (increment for each layer at same y)
    if (yLevelZIndex[yPos] === undefined) yLevelZIndex[yPos] = 0;
    var zOffset = yLevelZIndex[yPos] * zSpacing;
    yLevelZIndex[yPos]++;

    layerNodes.forEach(function(n, i) {
      var xPos = -rowWidth / 2 + i * spacing;
      positions[n.id] = { x: xPos, y: yPos, z: zOffset };
    });
  });

  return positions;
}

// ═══════════════════════════════════════════════════════════════════
//  Build Scene
// ═══════════════════════════════════════════════════════════════════

function buildScene(dataNodes, dataConns, dataPorts, dataTags) {
  // Clear
  while (nodeGroup.children.length > 0) nodeGroup.remove(nodeGroup.children[0]);
  while (edgeGroup.children.length > 0) edgeGroup.remove(edgeGroup.children[0]);
  while (portGroup.children.length > 0) portGroup.remove(portGroup.children[0]);
  nodeMeshes = {};
  edgeLines = [];
  portMeshes = {};
  selectedNodeId = null;

  if (!dataNodes || dataNodes.length === 0) return;

  var positions = computeLayout(dataNodes);
  var nodeMap = {}; // nodeId -> node data

  // ─── Build Nodes (Chip cubes) ──────────────────────────
  dataNodes.forEach(function(n) {
    nodeMap[n.id] = n;
    var pos = positions[n.id] || { x: 0, y: 0, z: 0 };
    var layer = n.layer || 'default';
    var layerCfg = LAYER_CONFIG[layer] || LAYER_CONFIG['default'] || { color: 0x888888 };
    var chipColor = n.color ? new THREE.Color(n.color).getHex() : layerCfg.color;

    var size = 1.2;
    var geo = new THREE.BoxGeometry(size, size * 0.6, size);
    var mat = new THREE.MeshStandardMaterial({
      color: chipColor,
      roughness: 0.4,
      metalness: 0.6,
      emissive: chipColor,
      emissiveIntensity: 0.08,
      transparent: true,
      opacity: 0.92,
    });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(pos.x, pos.y, pos.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    // Chip detail lines on top
    var lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
    var lineGeo = new THREE.BufferGeometry();
    var s = size * 0.4;
    var yOff = size * 0.3 + 0.01;
    var lPts = [];
    for (var li = -s; li <= s; li += s * 0.5) {
      lPts.push(li, yOff, -s, li, yOff, s);
    }
    for (var lj = -s; lj <= s; lj += s * 0.5) {
      lPts.push(-s, yOff, lj, s, yOff, lj);
    }
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(lPts, 3));
    var lines = new THREE.LineSegments(lineGeo, lineMat);
    mesh.add(lines);

    // Highlight border (edge glow)
    var edgeMat = new THREE.LineBasicMaterial({
      color: chipColor,
      transparent: true,
      opacity: 0.3,
    });
    var edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(size * 1.02, size * 0.62 * 1.02, size * 1.02));
    var edgeWire = new THREE.LineSegments(edgeGeo, edgeMat);
    mesh.add(edgeWire);

    // Store
    mesh.userData.nodeId = n.id;
    mesh.userData.isNode = true;
    nodeMeshes[n.id] = { mesh: mesh, data: n, ports: [], edges: [] };
    nodeGroup.add(mesh);

    // Label (CSS2D)
    var labelDiv = document.createElement('div');
    labelDiv.className = 'label-2d';
    labelDiv.textContent = n.chineseName || n.label || n.id;
    var label = new THREE.CSS2DObject(labelDiv);
    label.position.set(pos.x, pos.y + size * 0.6 + 0.4, pos.z);
    nodeGroup.add(label);
  });

  // ─── Build Ports ───────────────────────────────────────
  var portPositions = {}; // portId -> { x, y, z }

  if (dataPorts) {
    dataPorts.forEach(function(p) {
      var nodeId = p.nodeId;
      var nm = nodeMeshes[nodeId];
      if (!nm) return;
      var pos = nm.mesh.position.clone();
      var sz = 1.2;
      var isOutput = p.type === 'output';
      var portColor = isOutput ? 0xF44336 : 0x4CAF50;
      var radius = 0.12;

      // Determine edge position based on port index
      var portsForNode = nm.ports;
      portsForNode.push(p);
      var idx = portsForNode.length - 1;
      var total = portsForNode.length;

      // Place around the chip edge
      var angle = (idx / Math.max(total, 1)) * Math.PI * 2;
      var edgeX = Math.cos(angle) * sz * 0.55;
      var edgeZ = Math.sin(angle) * sz * 0.55;
      var edgeY = (isOutput ? 1 : -1) * sz * 0.15;

      pos.x += edgeX;
      pos.y += edgeY;
      pos.z += edgeZ;

      portPositions[p.portId] = { x: pos.x, y: pos.y, z: pos.z };

      // Port sphere
      var sphereGeo = new THREE.SphereGeometry(radius, 12, 12);
      var sphereMat = new THREE.MeshStandardMaterial({
        color: portColor,
        emissive: portColor,
        emissiveIntensity: 0.5,
        roughness: 0.3,
        metalness: 0.2,
      });
      var sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.position.copy(pos);
      sphere.userData.portId = p.portId;
      sphere.userData.isPort = true;
      sphere.userData.nodeId = nodeId;
      portGroup.add(sphere);
      portMeshes[p.portId] = sphere;

      // Port glow ring
      var ringGeo = new THREE.RingGeometry(radius * 0.8, radius * 1.8, 16);
      var ringMat = new THREE.MeshBasicMaterial({
        color: portColor,
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide,
      });
      var ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.copy(pos);
      ring.lookAt(camera.position);
      portGroup.add(ring);
      sphere.userData.ring = ring;

      // Store reference on node
      nm.ports.push(p);
    });
  }

  // ─── Build Edges ───────────────────────────────────────
  if (dataConns) {
    dataConns.forEach(function(conn) {
      var fromData = nodeMap[conn.from];
      var toData = nodeMap[conn.to];
      if (!fromData || !toData) return;

      var fromPos = positions[conn.from] || { x: 0, y: 0, z: 0 };
      var toPos = positions[conn.to] || { x: 0, y: 0, z: 0 };

      var p1 = new THREE.Vector3(fromPos.x, fromPos.y, fromPos.z);
      var p2 = new THREE.Vector3(toPos.x, toPos.y, toPos.z);
      var mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

      var flowType = conn.flowType || 'data';
      var colorHex = FLOW_COLORS[flowType] || 0x888888;

      // Curve with control points to avoid crossing
      var dist = p1.distanceTo(p2);
      var curveHeight = Math.min(dist * 0.2, 2.0);
      var isSameLayer = fromPos.y === toPos.y;
      var curveDir = isSameLayer ? 1 : (toPos.y > fromPos.y ? 1 : -1);

      var cp1 = new THREE.Vector3(
        mid.x + (fromPos.z - toPos.z) * 0.15,
        mid.y + curveHeight * curveDir,
        mid.z + (toPos.x - fromPos.x) * 0.15
      );

      var curve = new THREE.QuadraticBezierCurve3(p1, cp1, p2);
      var pts = curve.getPoints(24);

      // Main glow line
      var glowGeo = new THREE.BufferGeometry().setFromPoints(pts);
      var glowMat = new THREE.LineBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.25,
        linewidth: 1,
      });
      var glowLine = new THREE.Line(glowGeo, glowMat);
      edgeGroup.add(glowLine);

      // Core bright line
      var coreMat = new THREE.LineBasicMaterial({
        color: colorHex,
        transparent: true,
        opacity: 0.6,
      });
      var coreLine = new THREE.Line(glowGeo.clone(), coreMat);
      // Offset slightly for visual depth
      coreLine.position.y = 0.01;
      edgeGroup.add(coreLine);

      // Store edge data
      var edgeInfo = {
        line: coreLine,
        glowLine: glowLine,
        conn: conn,
        fromId: conn.from,
        toId: conn.to,
      };
      edgeLines.push(edgeInfo);

      // Link to nodes
      if (nodeMeshes[conn.from]) nodeMeshes[conn.from].edges.push(edgeInfo);
      if (nodeMeshes[conn.to]) nodeMeshes[conn.to].edges.push(edgeInfo);
    });
  }

  document.getElementById('nodeCount').textContent = dataNodes.length;
  document.getElementById('edgeCount').textContent = dataConns.length;
}

// ═══════════════════════════════════════════════════════════════════
//  Interaction
// ═══════════════════════════════════════════════════════════════════

function getIntersects(event) {
  var rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Collect all meshes
  var allMeshes = [];
  nodeGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isNode) allMeshes.push(c);
  });
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.isPort) allMeshes.push(c);
  });
  return raycaster.intersectObjects(allMeshes);
}

function onMouseMove(event) {
  var intersects = getIntersects(event);
  var found = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      var nm = nodeMeshes[obj.userData.nodeId];
      if (nm) {
        found = nm.data;
        break;
      }
    } else if (obj.userData.isPort) {
      // Show parent node info
      var pnm = nodeMeshes[obj.userData.nodeId];
      if (pnm) {
        found = pnm.data;
        break;
      }
    }
  }

  if (found) {
    var tt = tooltipEl;
    tt.style.display = 'block';
    tt.style.left = (event.clientX + 16) + 'px';
    tt.style.top = (event.clientY - 10) + 'px';
    var html = '<div class="tt-name">' + (found.chineseName || found.label || found.id) + '</div>';
    if (found.label && found.label !== found.id) {
      html += '<div class="tt-desc">' + found.label + '</div>';
    }
    if (found.layer) {
      html += '<div><span class="tt-tag" style="background:' + (LAYER_CONFIG[found.layer] ? '#' + new THREE.Color(LAYER_CONFIG[found.layer].color).getHexString() : '#555') + '44;color:#ccc">' + found.layer + '</span></div>';
    }
    tt.innerHTML = html;
    renderer.domElement.style.cursor = 'pointer';
  } else {
    tooltipEl.style.display = 'none';
    renderer.domElement.style.cursor = 'default';
  }
}

function onClick(event) {
  var intersects = getIntersects(event);
  var clickedNodeId = null;

  for (var i = 0; i < intersects.length; i++) {
    var obj = intersects[i].object;
    if (obj.userData.isNode) {
      clickedNodeId = obj.userData.nodeId;
      break;
    } else if (obj.userData.isPort) {
      clickedNodeId = obj.userData.nodeId;
      break;
    }
  }

  // Reset all
  Object.keys(nodeMeshes).forEach(function(id) {
    var nm = nodeMeshes[id];
    nm.mesh.material.emissiveIntensity = 0.08;
  });

  // Reset all edges
  edgeLines.forEach(function(ei) {
    ei.line.material.opacity = 0.6;
    ei.glowLine.material.opacity = 0.25;
  });

  if (clickedNodeId) {
    selectedNodeId = clickedNodeId;
    var nm = nodeMeshes[clickedNodeId];
    if (nm) {
      nm.mesh.material.emissiveIntensity = 0.5;
      // Highlight connected edges
      nm.edges.forEach(function(ei) {
        ei.line.material.opacity = 1.0;
        ei.glowLine.material.opacity = 0.6;
      });
    }
  } else {
    selectedNodeId = null;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Resize
// ═══════════════════════════════════════════════════════════════════

function onResize() {
  var w = window.innerWidth;
  var h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}

// ═══════════════════════════════════════════════════════════════════
//  Stats
// ═══════════════════════════════════════════════════════════════════

var frameCount = 0;
var lastFpsUpdate = 0;

function updateStats() {
  var now = performance.now();
  frameCount++;
  if (now - lastFpsUpdate >= 1000) {
    document.getElementById('fps').textContent = frameCount;
    frameCount = 0;
    lastFpsUpdate = now;
  }
}

// ═══════════════════════════════════════════════════════════════════
//  Animation Loop
// ═══════════════════════════════════════════════════════════════════

function animate() {
  requestAnimationFrame(animate);

  // Auto-rotate
  if (autoRotate) {
    var pivot = new THREE.Vector3(0, 0, 0);
    var radius = camera.position.distanceTo(pivot);
    var theta = Math.atan2(camera.position.x, camera.position.z);
    theta += autoRotateSpeed;
    camera.position.x = radius * Math.sin(theta);
    camera.position.z = radius * Math.cos(theta);
    camera.lookAt(pivot);
    controls.update();
  } else {
    controls.update();
  }

  // Make port rings face camera
  portGroup.children.forEach(function(c) {
    if (c.isMesh && c.userData.ring) {
      c.userData.ring.lookAt(camera.position);
    }
  });

  // Edge pulse animation
  var t = clock.getElapsedTime();
  edgeLines.forEach(function(ei, idx) {
    var pulse = 0.5 + 0.3 * Math.sin(t * 0.8 + idx * 0.5);
    ei.glowLine.material.opacity = 0.15 + 0.2 * pulse;
  });

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  updateStats();
}

// ═══════════════════════════════════════════════════════════════════
//  Start
// ═══════════════════════════════════════════════════════════════════

init();

var embeddedData = window.__EMBEDDED_DATA__;
if (embeddedData && embeddedData.nodes) {
  buildScene(
    embeddedData.nodes,
    embeddedData.connections || [],
    embeddedData.ports || [],
    embeddedData.tags || {}
  );
  console.log('[3d-monitor] Loaded from embedded data: ' + embeddedData.nodes.length + ' nodes');
} else {
  console.warn('[3d-monitor] No embedded data found (window.__EMBEDDED_DATA__)');
}

})();
</script>
